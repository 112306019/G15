<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歡迎 — KOC 平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2C2C2C;
    --card: #6B6B6B;
    --card-hover: #5A5A5A;
    --card-active: #4A4A4A;
    --text-white: #FFFFFF;
    --text-muted: rgba(255,255,255,0.6);
    --accent: #C8522A;
    --divider: rgba(255,255,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-white);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    position: relative;
    overflow: hidden;
  }

  /* subtle background texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255,255,255,0.02) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Heading */
  .heading {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.5s ease both;
  }
  .heading h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 42px;
    color: var(--text-white);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .heading p {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  /* Cards container */
  .cards {
    display: flex;
    align-items: stretch;
    gap: 0;
    width: 100%;
    max-width: 860px;
    position: relative;
  }

  /* vertical divider */
  .cards::before {
    content: '';
    position: absolute;
    left: 50%; top: 5%; bottom: 5%;
    width: 1px;
    background: var(--divider);
    transform: translateX(-50%);
    z-index: 2;
  }

  /* Role card */
  .role-card {
    flex: 1;
    background: var(--card);
    border-radius: 20px;
    padding: 48px 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 24px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative;
    overflow: hidden;
    min-height: 480px;
    animation: fadeUp 0.5s ease both;
  }
  .role-card:first-child { animation-delay: 0.1s; border-radius: 20px 8px 8px 20px; }
  .role-card:last-child { animation-delay: 0.2s; border-radius: 8px 20px 20px 8px; }

  .role-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .role-card:hover {
    background: var(--card-hover);
    transform: translateY(-6px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .role-card:hover .card-arrow { opacity: 1; transform: translateX(0); }
  .role-card:active { transform: translateY(-2px); background: var(--card-active); }

  /* Image placeholder */
  .card-image {
    position: absolute;
    top: 40px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 160px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s;
  }
  .role-card:hover .card-image { transform: translateX(-50%) scale(1.04); }
  .card-image svg { width: 72px; height: 72px; color: rgba(255,255,255,0.7); }

  /* Text content */
  .card-body {
    position: relative; z-index: 1;
    text-align: center;
    margin-top: auto;
    padding-top: 200px;
  }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text-white);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  .card-arrow {
    margin-top: 16px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: rgba(255,255,255,0.8);
    opacity: 0; transform: translateX(-6px);
    transition: all 0.25s;
  }
  .card-arrow svg { width: 16px; height: 16px; }

  /* Highlight dot for KOC card */
  .koc-badge {
    position: absolute; top: 20px; right: 20px; z-index: 3;
    background: var(--accent);
    color: white; font-size: 10px;
    letter-spacing: 0.1em; font-family: 'Space Mono', monospace;
    padding: 4px 10px; border-radius: 20px;
    opacity: 0; transform: translateY(-4px);
    transition: all 0.3s 0.1s;
  }
  .role-card:hover .koc-badge { opacity: 1; transform: translateY(0); }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Selection overlay */
  .role-card.selected::after {
    content: '✓';
    position: absolute; inset: 0;
    background: rgba(200, 82, 42, 0.15);
    border: 2px solid var(--accent);
    border-radius: inherit;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; color: var(--accent);
    animation: selectPop 0.3s ease;
  }
  @keyframes selectPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="heading">
  <h1>歡迎!</h1>
  <p>KOC 平台名稱</p>
</div>

<div class="cards">

  <!-- Seller -->
  <div class="role-card" id="sellerCard" onclick="selectRole('seller')">
    <div class="card-image">
      <svg fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="card-title">我是賣家！</div>
      <div class="card-arrow">
        進入賣家後台
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>

  <!-- KOC -->
  <div class="role-card" id="kocCard" onclick="selectRole('koc')">
    <span class="koc-badge">NEW</span>
    <div class="card-image">
      <svg fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="card-title">我想成為KOC！</div>
      <div class="card-subtitle">直接購物選這裡！</div>
      <div class="card-arrow">
        開始購物體驗
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>

</div>

<script>
  function selectRole(role) {
    const card = document.getElementById(role === 'seller' ? 'sellerCard' : 'kocCard');
    card.classList.add('selected');
    setTimeout(() => card.classList.remove('selected'), 600);
  }
</script>
</body>
</html>
