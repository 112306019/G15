<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>註冊帳號 — KOC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3A3A3A;
    --dark-light: #4A4A4A;
    --cream: #F5F0E8;
    --ink: #1A1A18;
    --warm-gray: #8C8880;
    --border: #E2DDD4;
    --field-bg: #F0F2F5;
    --accent: #C8522A;
    --white: #FFFFFF;
    --green: #6BBF6B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Serif TC', serif; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }

  /* ── LEFT PANEL ── */
  .left {
    background: var(--dark);
    padding: 40px 48px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    min-height: 100vh;
  }
  .left::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 80%, rgba(255,255,255,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .left-logo {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--white); color: var(--ink);
    font-family: 'DM Serif Display', serif;
    font-size: 16px; letter-spacing: 0.08em;
    padding: 8px 20px; border-radius: 40px;
    cursor: pointer; width: fit-content;
    transition: all 0.2s; margin-bottom: auto;
  }
  .left-logo:hover { background: var(--cream); }

  .left-copy {
    margin-bottom: 48px;
  }
  .left-title {
    font-family: 'DM Serif Display', serif;
    font-size: 40px; color: var(--white);
    line-height: 1.15; margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
  }
  .left-subtitle {
    font-size: 15px; color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .left-image {
    width: 240px; height: 200px;
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    animation: fadeUp 0.5s ease 0.2s both;
  }
  .left-image svg { width: 80px; height: 80px; color: rgba(255,255,255,0.6); }

  /* ── RIGHT PANEL ── */
  .right {
    background: var(--white);
    display: flex; align-items: center; justify-content: center;
    padding: 60px 80px;
  }

  .form-wrap {
    width: 100%; max-width: 400px;
    animation: fadeUp 0.45s ease 0.05s both;
  }

  .form-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px; color: var(--ink);
    margin-bottom: 36px;
  }

  /* Field */
  .field { margin-bottom: 20px; }
  .field-label {
    display: block; font-size: 13px; color: var(--ink);
    margin-bottom: 8px; letter-spacing: 0.02em;
  }
  .field-input {
    width: 100%; background: var(--field-bg);
    border: 1.5px solid transparent; border-radius: 10px;
    padding: 13px 16px;
    font-family: 'Noto Serif TC', serif; font-size: 14px;
    color: var(--ink); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .field-input::placeholder { color: #B0B4BA; font-size: 13px; }
  .field-input:focus { border-color: var(--ink); background: var(--white); }
  .field-input.valid { border-color: var(--green); background: var(--white); }
  .field-input.error { border-color: var(--accent); background: #FEF5F3; }
  .field-hint { font-size: 11px; color: var(--warm-gray); margin-top: 6px; letter-spacing: 0.03em; }
  .field-hint.error { color: var(--accent); }

  /* Password wrapper */
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--warm-gray);
    display: flex; align-items: center; transition: color 0.2s;
  }
  .pw-toggle:hover { color: var(--ink); }
  .pw-toggle svg { width: 18px; height: 18px; }

  /* Checkbox */
  .checkbox-row {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 28px; cursor: pointer;
  }
  .checkbox {
    width: 20px; height: 20px; min-width: 20px; border-radius: 5px;
    border: 1.5px solid var(--border); background: var(--white);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; margin-top: 1px;
  }
  .checkbox.checked { background: var(--ink); border-color: var(--ink); }
  .checkbox svg { width: 11px; height: 11px; color: white; display: none; }
  .checkbox.checked svg { display: block; }
  .checkbox-label { font-size: 13px; color: var(--warm-gray); line-height: 1.6; }
  .checkbox-label a { color: var(--ink); text-decoration: underline; cursor: pointer; }

  /* Submit */
  .submit-btn {
    width: 100%; background: var(--ink); color: var(--white);
    border: none; padding: 15px;
    border-radius: 40px; font-family: 'Noto Serif TC', serif;
    font-size: 16px; letter-spacing: 0.06em;
    cursor: pointer; transition: all 0.25s; margin-bottom: 20px;
  }
  .submit-btn:hover { background: var(--accent); transform: translateY(-1px); }
  .submit-btn:disabled { background: var(--warm-gray); cursor: not-allowed; transform: none; }

  /* Login link */
  .login-link { text-align: center; font-size: 13px; color: var(--warm-gray); }
  .login-link a { color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; }
  .login-link a:hover { color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="left-logo">★ LOGO</div>

  <div class="left-copy">
    <h1 class="left-title">歡迎註冊帳號!</h1>
    <p class="left-subtitle">KOC 平台名稱</p>
  </div>

  <div class="left-image">
    <svg fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="form-wrap">
    <h2 class="form-title">註冊帳號</h2>

    <!-- Name -->
    <div class="field">
      <label class="field-label">全名</label>
      <input class="field-input" type="text" id="name" placeholder="請輸入姓名" oninput="validateName(this)">
    </div>

    <!-- Email / Phone -->
    <div class="field">
      <label class="field-label">電子郵件 或 手機號碼</label>
      <input class="field-input" type="text" id="email" placeholder="請輸入電子郵件 或 手機號碼" oninput="validateEmail(this)">
    </div>

    <!-- Password -->
    <div class="field">
      <label class="field-label">密碼</label>
      <div class="pw-wrap">
        <input class="field-input" type="password" id="password" placeholder="請輸入密碼" oninput="validatePassword(this)">
        <button class="pw-toggle" onclick="togglePw()" type="button" id="pwToggle">
          <svg id="eyeIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="field-hint" id="pwHint">密碼需有至少8位</p>
    </div>

    <!-- Terms -->
    <div class="checkbox-row" onclick="toggleTerms()">
      <div class="checkbox" id="termsCheck">
        <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span class="checkbox-label">建立帳戶即表示您同意我們的<a>條款和條件</a>以及<a>隱私權政策</a>。</span>
    </div>

    <!-- Submit -->
    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">註冊</button>

    <!-- Login link -->
    <p class="login-link">已經有帳號了嗎？ <a href="#">登入</a></p>
  </div>
</div>

<script>
  let termsAccepted = false;

  function validateName(el) {
    el.classList.toggle('valid', el.value.trim().length >= 2);
    el.classList.remove('error');
  }

  function validateEmail(el) {
    const v = el.value.trim();
    const valid = v.includes('@') || /^[0-9]{8,}$/.test(v);
    el.classList.toggle('valid', valid && v.length > 0);
    el.classList.remove('error');
  }

  function validatePassword(el) {
    const hint = document.getElementById('pwHint');
    if (el.value.length === 0) {
      el.classList.remove('valid', 'error');
      hint.className = 'field-hint';
      hint.textContent = '密碼需有至少8位';
    } else if (el.value.length < 8) {
      el.classList.add('error'); el.classList.remove('valid');
      hint.className = 'field-hint error';
      hint.textContent = `還需 ${8 - el.value.length} 個字元`;
    } else {
      el.classList.add('valid'); el.classList.remove('error');
      hint.className = 'field-hint';
      hint.textContent = '✓ 密碼強度足夠';
      hint.style.color = 'var(--green)';
    }
  }

  let pwVisible = false;
  function togglePw() {
    pwVisible = !pwVisible;
    const pw = document.getElementById('password');
    pw.type = pwVisible ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  function toggleTerms() {
    termsAccepted = !termsAccepted;
    document.getElementById('termsCheck').classList.toggle('checked', termsAccepted);
  }

  function handleSubmit() {
    const name = document.getElementById('name');
    const email = document.getElementById('email');
    const pw = document.getElementById('password');
    let ok = true;

    if (name.value.trim().length < 2) { name.classList.add('error'); ok = false; }
    if (!email.classList.contains('valid')) { email.classList.add('error'); ok = false; }
    if (pw.value.length < 8) { pw.classList.add('error'); ok = false; }
    if (!termsAccepted) { ok = false; }

    if (!ok) return;

    const btn = document.getElementById('submitBtn');
    btn.textContent = '註冊中...';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = '✓ 註冊成功！';
      btn.style.background = 'var(--green)';
    }, 1200);
  }
</script>
</body>
</html>
