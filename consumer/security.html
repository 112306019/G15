<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入與安全性 — SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F5F0E8;--ink:#1A1A18;--warm-gray:#8C8880;--accent:#C8522A;--border:#E2DDD4;--field-bg:#F5F5F5;--white:#FFFFFF;--green:#6BBF6B; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:'Noto Serif TC',serif;min-height:100vh}
  nav{background:var(--cream);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 48px;height:60px;position:sticky;top:0;z-index:100;gap:32px}
  .logo{display:flex;align-items:center;gap:8px;font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:.08em;border:1.5px solid var(--ink);padding:6px 20px;border-radius:40px;cursor:pointer;transition:all .2s;white-space:nowrap;background:var(--ink);color:#fff}
  .logo:hover{background:var(--accent);border-color:var(--accent)}
  .nav-divider{width:1px;height:24px;background:var(--border)}
  .nav-link{font-size:13px;color:var(--warm-gray);cursor:pointer;transition:color .2s}
  .nav-link:hover{color:var(--ink)}
  .nav-actions{margin-left:auto;display:flex;align-items:center;gap:20px}
  .cart-btn{position:relative;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .cart-btn svg{width:22px;height:22px}
  .cart-badge{position:absolute;top:-2px;right:-2px;background:var(--accent);color:white;font-family:'Space Mono',monospace;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .user-btn{cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .user-btn svg{width:22px;height:22px}
  .page{max-width:1000px;margin:0 auto;padding:48px 24px 80px;display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
  .sidebar{background:white;border:1px solid var(--border);border-radius:16px;padding:8px 0;position:sticky;top:80px}
  .sidebar-item{display:flex;align-items:center;gap:12px;padding:13px 20px;font-size:14px;color:var(--warm-gray);cursor:pointer;transition:all .2s;position:relative}
  .sidebar-item:hover{color:var(--ink);background:var(--cream)}
  .sidebar-item.active{color:var(--ink);font-weight:700}
  .sidebar-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--ink);border-radius:0 2px 2px 0}
  .sidebar-item svg{width:16px;height:16px;flex-shrink:0}
  .content{display:flex;flex-direction:column;gap:0}
  .page-title{font-family:'DM Serif Display',serif;font-size:36px;color:var(--ink);margin-bottom:40px}
  .section{margin-bottom:8px}
  .section-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:20px}
  .divider{height:1px;background:var(--border);margin:28px 0}
  .info-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
  .info-label{font-size:14px;color:var(--ink);font-weight:700;margin-bottom:4px}
  .info-sub{font-size:12px;color:var(--warm-gray)}
  .outline-btn{background:white;color:var(--ink);border:1.5px solid var(--border);padding:9px 20px;border-radius:40px;font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .outline-btn:hover{border-color:var(--ink);background:var(--cream)}
  .outline-btn.connected{border-color:var(--green);color:var(--green)}
  .outline-btn.connected:hover{background:#F0FAF0}
  .social-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .social-item{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
  .social-item:first-child{padding-right:32px;border-right:1px solid var(--border)}
  .social-item:last-child{padding-left:32px}
  .social-name{font-size:14px;color:var(--ink);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .social-name svg{width:16px;height:16px}
  .social-status{font-size:12px;color:var(--warm-gray)}
  .social-status.connected-text{color:var(--green)}
  .session-list{display:flex;flex-direction:column}
  .session-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);transition:all .2s}
  .session-row:last-child{border-bottom:none}
  .session-row:hover{background:#FDFAF6;margin:0 -12px;padding:18px 12px;border-radius:8px}
  .session-name{font-size:14px;color:var(--ink);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .session-badge{background:var(--cream);border:1px solid var(--border);font-size:10px;color:var(--warm-gray);padding:2px 8px;border-radius:10px;font-family:'Space Mono',monospace}
  .session-badge.current{background:#EEF8EE;border-color:var(--green);color:var(--green)}
  .session-date{font-size:12px;color:var(--warm-gray)}
  .logout-btn{background:white;color:var(--ink);border:1.5px solid var(--border);padding:8px 16px;border-radius:40px;font-size:12px;font-family:'Noto Serif TC',serif;cursor:pointer;transition:all .2s;white-space:nowrap}
  .logout-btn:hover{border-color:var(--accent);color:var(--accent)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-overlay.show{opacity:1;pointer-events:all}
  .modal{background:white;border-radius:20px;padding:36px;width:440px;max-width:90vw;transform:translateY(16px);transition:transform .25s}
  .modal-overlay.show .modal{transform:translateY(0)}
  .modal-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:24px}
  .modal-field{margin-bottom:16px}
  .modal-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--warm-gray);margin-bottom:8px;display:block}
  .modal-input{width:100%;background:var(--field-bg);border:1.5px solid transparent;border-radius:10px;padding:13px 16px;font-family:'Noto Serif TC',serif;font-size:14px;color:var(--ink);outline:none;transition:all .2s}
  .modal-input:focus{border-color:var(--ink);background:white}
  .modal-actions{display:flex;gap:12px;margin-top:24px}
  .modal-confirm{flex:1;background:var(--ink);color:white;border:none;padding:12px;border-radius:40px;font-family:'Noto Serif TC',serif;font-size:14px;cursor:pointer;transition:background .2s}
  .modal-confirm:hover{background:var(--accent)}
  .modal-cancel{flex:1;background:white;color:var(--warm-gray);border:1.5px solid var(--border);padding:12px;border-radius:40px;font-family:'Noto Serif TC',serif;font-size:14px;cursor:pointer;transition:all .2s}
  .modal-cancel:hover{border-color:var(--ink);color:var(--ink)}
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:white;padding:12px 24px;border-radius:40px;font-size:13px;opacity:0;transition:all .3s;z-index:999;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--cream)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<nav>
  <div class="logo">&#9733; LOGO</div>
  <div class="nav-divider"></div>
  <span class="nav-link">&#39318;&#39003;</span>
  <div class="nav-actions">
    <div class="cart-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-badge">2</span>
    </div>
    <div class="user-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</nav>

<div class="page">
  <aside class="sidebar">
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>&#20491;&#20154;&#36039;&#35338;
    </div>
    <div class="sidebar-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>&#30331;&#20837;&#33287;&#23433;&#20840;&#24615;
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>&#25105;&#30340;&#40670;&#25976;
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>我的訂單
    </div>
  </aside>

  <div class="content">
    <h1 class="page-title">&#30331;&#20837;&#33287;&#23433;&#20840;&#24615;</h1>

    <div class="section">
      <div class="section-title">&#30331;&#20837;</div>
      <div class="info-row">
        <div>
          <div class="info-label">&#23494;&#30908;</div>
          <div class="info-sub">&#19978;&#27425;&#26356;&#26032;&#28858;&#19968;&#20491;&#26376;&#21069;</div>
        </div>
        <button class="outline-btn" onclick="openPasswordModal()">&#26356;&#26032;&#23494;&#30908;</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">&#31038;&#32676;&#32178;&#31449;&#24115;&#34399;</div>
      <div class="social-grid">
        <div class="social-item">
          <div>
            <div class="social-name">
              <svg viewBox="0 0 24 24" fill="#1877F2" width="16" height="16"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              Facebook
            </div>
            <div class="social-status" id="fbStatus">&#26410;&#36887;&#32080;</div>
          </div>
          <button class="outline-btn" id="fbBtn" onclick="connectSocial('fb')">Connect</button>
        </div>
        <div class="social-item">
          <div>
            <div class="social-name">
              <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
              Apple account
            </div>
            <div class="social-status" id="appleStatus">&#26410;&#36887;&#32080;</div>
          </div>
          <button class="outline-btn" id="appleBtn" onclick="connectSocial('apple')">Connect</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">&#30331;&#20837;&#35352;&#37636;</div>
      <div class="session-list" id="sessionList">
        <div class="session-row" id="session0">
          <div>
            <div class="session-name">Session <span class="session-badge current">&#30446;&#21069;&#35069;&#32622;</span></div>
            <div class="session-date">May 14, 2021 at 08:36pm</div>
          </div>
          <button class="logout-btn" onclick="logoutDevice('session0')">Log out device</button>
        </div>
        <div class="session-row" id="session1">
          <div>
            <div class="session-name">macOs Big Sur. Chrome</div>
            <div class="session-date">May 14, 2021 at 08:36pm</div>
          </div>
          <button class="logout-btn" onclick="logoutDevice('session1')">Log out device</button>
        </div>
        <div class="session-row" id="session2">
          <div>
            <div class="session-name">Session</div>
            <div class="session-date">May 14, 2021 at 08:36pm</div>
          </div>
          <button class="logout-btn" onclick="logoutDevice('session2')">Log out device</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-overlay" id="pwModal" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-title">&#26356;&#26032;&#23494;&#30908;</div>
    <div class="modal-field">
      <label class="modal-label">&#30446;&#21069;&#23494;&#30908;</label>
      <input class="modal-input" type="password" placeholder="&#36664;&#20837;&#30446;&#21069;&#23494;&#30908;">
    </div>
    <div class="modal-field">
      <label class="modal-label">&#26032;&#23494;&#30908;</label>
      <input class="modal-input" type="password" id="newPw" placeholder="&#36664;&#20837;&#26032;&#23494;&#30908;&#65288;&#33267;&#23569;8&#20491;&#65289;">
    </div>
    <div class="modal-field">
      <label class="modal-label">&#30906;&#35469;&#26032;&#23494;&#30908;</label>
      <input class="modal-input" type="password" id="confirmPw" placeholder="&#20877;&#27425;&#36664;&#20837;&#26032;&#23494;&#30908;">
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closePwModal()">&#21462;&#28040;</button>
      <button class="modal-confirm" onclick="savePassword()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
    });
  });
  function openPasswordModal() { document.getElementById('pwModal').classList.add('show'); }
  function closePwModal() { document.getElementById('pwModal').classList.remove('show'); }
  function closeOnOverlay(e) { if (e.target === e.currentTarget) closePwModal(); }
  function savePassword() {
    const np = document.getElementById('newPw').value;
    const cp = document.getElementById('confirmPw').value;
    if (np.length < 8) { showToast('新密碼需至少8位'); return; }
    if (np !== cp) { showToast('兩次輸入的密碼不相符'); return; }
    closePwModal();
    showToast('✓ 密碼已成功更新');
  }
  function connectSocial(platform) {
    const btn = document.getElementById(platform + 'Btn');
    const status = document.getElementById(platform + 'Status');
    btn.textContent = '連結中...';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = '已連結';
      btn.classList.add('connected');
      btn.disabled = false;
      status.textContent = '已連結';
      status.className = 'social-status connected-text';
      showToast('✓ ' + (platform === 'fb' ? 'Facebook' : 'Apple') + ' 帳號已連結');
    }, 1200);
  }
  function logoutDevice(id) {
    const row = document.getElementById(id);
    row.style.transition = 'opacity .3s, transform .3s';
    row.style.opacity = '0';
    row.style.transform = 'translateX(16px)';
    setTimeout(() => { row.remove(); showToast('裝置已登出'); }, 350);
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
