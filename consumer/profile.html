<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人資訊 — SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --ink: #1A1A18;
    --warm-gray: #8C8880;
    --accent: #C8522A;
    --border: #E2DDD4;
    --field-bg: #F5F5F5;
    --white: #FFFFFF;
    --green: #6BBF6B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Noto Serif TC', serif; min-height: 100vh; }

  /* NAV */
  nav { background: var(--cream); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 48px; height: 60px; position: sticky; top: 0; z-index: 100; gap: 32px; }
  .logo { display: flex; align-items: center; gap: 8px; font-family: 'DM Serif Display', serif; font-size: 18px; letter-spacing: 0.08em; border: 1.5px solid var(--ink); padding: 6px 20px; border-radius: 40px; cursor: pointer; transition: all 0.2s; white-space: nowrap; background: var(--ink); color: #fff; }
  .logo:hover { background: var(--accent); border-color: var(--accent); }
  .nav-divider { width: 1px; height: 24px; background: var(--border); }
  .nav-link { font-size: 13px; color: var(--warm-gray); cursor: pointer; transition: color 0.2s; }
  .nav-link:hover { color: var(--ink); }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .cart-btn { position: relative; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .cart-btn svg { width: 22px; height: 22px; }
  .cart-badge { position: absolute; top: -2px; right: -2px; background: var(--accent); color: white; font-family: 'Space Mono', monospace; font-size: 9px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .user-btn { cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .user-btn svg { width: 22px; height: 22px; }

  /* PAGE */
  .page { max-width: 1000px; margin: 0 auto; padding: 48px 24px 80px; display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }

  /* SIDEBAR */
  .sidebar { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 8px 0; position: sticky; top: 80px; }
  .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 13px 20px; font-size: 14px; color: var(--warm-gray); cursor: pointer; transition: all 0.2s; position: relative; }
  .sidebar-item:hover { color: var(--ink); background: var(--cream); }
  .sidebar-item.active { color: var(--ink); font-weight: 700; }
  .sidebar-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: var(--ink); border-radius: 0 2px 2px 0; }
  .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* CONTENT */
  .content {}

  /* Page header */
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--ink); }
  .edit-btn { background: white; color: var(--ink); border: 1.5px solid var(--border); padding: 8px 20px; border-radius: 40px; font-family: 'Noto Serif TC', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .edit-btn:hover { border-color: var(--ink); background: var(--cream); }
  .edit-btn.active { background: var(--ink); color: white; border-color: var(--ink); }

  /* Section */
  .section-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 20px; letter-spacing: 0.03em; }

  /* Form grid */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-full { margin-bottom: 16px; }

  .field-label { display: block; font-size: 11px; letter-spacing: 0.09em; color: var(--warm-gray); text-transform: uppercase; margin-bottom: 8px; }
  .field-input { width: 100%; background: var(--field-bg); border: 1.5px solid transparent; border-radius: 10px; padding: 13px 16px; font-family: 'Noto Serif TC', serif; font-size: 14px; color: var(--ink); outline: none; transition: all 0.2s; }
  .field-input::placeholder { color: #BBBBBB; }
  .field-input:disabled { cursor: default; opacity: 0.7; }
  .field-input:focus:not(:disabled) { border-color: var(--ink); background: white; }
  .field-input.has-value { color: var(--ink); }

  /* KOC button */
  .koc-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: white; border: none; padding: 13px 28px; border-radius: 40px; font-family: 'Noto Serif TC', serif; font-size: 15px; letter-spacing: 0.04em; cursor: pointer; transition: all 0.25s; margin-bottom: 36px; }
  .koc-btn:hover { background: var(--accent); transform: translateY(-1px); }
  .koc-btn svg { width: 16px; height: 16px; }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin-bottom: 28px; }

  /* Bottom actions */
  .bottom-actions { display: flex; align-items: center; gap: 20px; }
  .update-btn { background: var(--ink); color: white; border: none; padding: 12px 28px; border-radius: 40px; font-family: 'Noto Serif TC', serif; font-size: 15px; cursor: pointer; transition: all 0.25s; }
  .update-btn:hover { background: var(--accent); transform: translateY(-1px); }
  .clear-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--warm-gray); font-family: 'Noto Serif TC', serif; font-size: 14px; cursor: pointer; transition: color 0.2s; }
  .clear-btn:hover { color: var(--accent); }
  .clear-btn svg { width: 14px; height: 14px; }

  /* Toast */
  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink); color: white; padding: 12px 24px; border-radius: 40px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <div class="logo">★ LOGO</div>
  <div class="nav-divider"></div>
  <span class="nav-link">首頁</span>
  <div class="nav-actions">
    <div class="cart-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-badge">2</span>
    </div>
    <div class="user-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</nav>

<div class="page">

  <aside class="sidebar">
    <div class="sidebar-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>個人資訊
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>登入與安全性
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>我的點數
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>我的訂單
    </div>
  </aside>

  <div class="content">

    <div class="page-header">
      <h1 class="page-title">個人資訊</h1>
      <button class="edit-btn" id="editBtn" onclick="toggleEdit()">修改</button>
    </div>

    <p class="section-title">帳戶資料</p>

    <div class="form-grid">
      <div>
        <label class="field-label">顯示名稱</label>
        <input class="field-input" type="text" id="displayName" placeholder="顯示名稱" disabled>
      </div>
      <div>
        <label class="field-label">真實姓名</label>
        <input class="field-input" type="text" id="realName" placeholder="真實姓名" disabled>
      </div>
    </div>

    <div class="form-grid">
      <div>
        <label class="field-label">手機號碼</label>
        <input class="field-input" type="tel" id="phone" placeholder="手機號碼" disabled>
      </div>
      <div>
        <label class="field-label">電子郵件</label>
        <input class="field-input" type="email" id="email" placeholder="電子郵件" disabled>
      </div>
    </div>

    <div class="form-full">
      <label class="field-label">通訊地址</label>
      <input class="field-input" type="text" id="address" placeholder="地址" disabled>
    </div>

    <div class="divider"></div>

    <button class="koc-btn" onclick="applyKOC()">
      申請成為KOC
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <div class="divider"></div>

    <div class="bottom-actions">
      <button class="update-btn" onclick="handleUpdate()">更新</button>
      <button class="clear-btn" onclick="clearAll()">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        全部清空
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let editing = false;
  const fields = ['displayName','realName','phone','email','address'];

  function toggleEdit() {
    editing = !editing;
    const btn = document.getElementById('editBtn');
    btn.textContent = editing ? '取消' : '修改';
    btn.classList.toggle('active', editing);
    fields.forEach(id => {
      const el = document.getElementById(id);
      el.disabled = !editing;
      if (editing) el.focus && el === document.getElementById('displayName') && el.focus();
    });
  }

  function handleUpdate() {
    showToast('✓ 資料已更新');
    if (editing) toggleEdit();
  }

  function clearAll() {
    fields.forEach(id => document.getElementById(id).value = '');
    showToast('已清空所有欄位');
  }

  function applyKOC() {
    showToast('✓ 已送出 KOC 申請，請等待審核');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
    });
  });
</script>
</body>
</html>
