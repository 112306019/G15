<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — KOC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3A3A3A;
    --cream: #F5F0E8;
    --ink: #1A1A18;
    --warm-gray: #8C8880;
    --border: #E2DDD4;
    --field-bg: #F0F2F5;
    --accent: #C8522A;
    --white: #FFFFFF;
    --green: #6BBF6B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Serif TC', serif; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }

  /* LEFT */
  .left {
    background: var(--dark); padding: 40px 48px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden; min-height: 100vh;
  }
  .left::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 80%, rgba(255,255,255,0.04) 0%, transparent 60%); pointer-events: none; }
  .left-logo { display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--ink); font-family: 'DM Serif Display', serif; font-size: 16px; letter-spacing: 0.08em; padding: 8px 20px; border-radius: 40px; cursor: pointer; width: fit-content; transition: all 0.2s; margin-bottom: auto; }
  .left-logo:hover { background: var(--cream); }
  .left-copy { margin-bottom: 48px; }
  .left-title { font-family: 'DM Serif Display', serif; font-size: 48px; color: var(--white); margin-bottom: 20px; animation: fadeUp 0.5s ease both; }
  .left-subtitle { font-size: 15px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; animation: fadeUp 0.5s ease 0.1s both; }
  .left-image { width: 240px; height: 200px; background: rgba(255,255,255,0.12); border-radius: 12px; display: flex; align-items: center; justify-content: center; animation: fadeUp 0.5s ease 0.2s both; }
  .left-image svg { width: 80px; height: 80px; color: rgba(255,255,255,0.6); }

  /* RIGHT */
  .right { background: var(--white); display: flex; align-items: center; justify-content: center; padding: 60px 80px; }
  .form-wrap { width: 100%; max-width: 400px; animation: fadeUp 0.45s ease 0.05s both; }
  .form-title { font-family: 'DM Serif Display', serif; font-size: 34px; color: var(--ink); margin-bottom: 36px; }

  /* Fields */
  .field { margin-bottom: 20px; }
  .field-label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 8px; letter-spacing: 0.02em; }
  .pw-wrap { position: relative; }
  .field-input { width: 100%; background: var(--field-bg); border: 1.5px solid transparent; border-radius: 10px; padding: 13px 44px 13px 16px; font-family: 'Noto Serif TC', serif; font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.2s, background 0.2s; }
  .field-input::placeholder { color: #B0B4BA; font-size: 13px; }
  .field-input:focus { border-color: var(--ink); background: var(--white); }
  .field-input.valid { border-color: var(--green); background: var(--white); }
  .field-input.error { border-color: var(--accent); background: #FEF5F3; }
  .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--warm-gray); display: flex; align-items: center; transition: color 0.2s; }
  .pw-toggle:hover { color: var(--ink); }
  .pw-toggle svg { width: 18px; height: 18px; }

  .forgot-row { text-align: right; margin-top: 6px; }
  .forgot-link { font-size: 12px; color: var(--warm-gray); cursor: pointer; transition: color 0.2s; }
  .forgot-link:hover { color: var(--ink); }

  /* Social divider */
  .social-divider { display: flex; align-items: center; gap: 14px; margin: 24px 0 20px; }
  .social-divider span { font-size: 12px; color: var(--warm-gray); white-space: nowrap; }
  .social-divider::before, .social-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Social buttons */
  .social-row { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; }
  .social-btn { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 20px; }
  .social-btn:hover { border-color: var(--ink); background: var(--cream); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }

  /* Google G */
  .g-icon { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  /* Apple */
  .apple-icon svg { width: 22px; height: 22px; color: var(--ink); }
  /* Facebook */
  .fb-icon { color: #1877F2; font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 900; line-height: 1; }

  /* Submit */
  .submit-btn { width: 100%; background: var(--ink); color: var(--white); border: none; padding: 15px; border-radius: 40px; font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: 0.06em; cursor: pointer; transition: all 0.25s; margin-bottom: 24px; }
  .submit-btn:hover { background: var(--accent); transform: translateY(-1px); }

  /* Register link */
  .register-link { text-align: center; font-size: 13px; color: var(--warm-gray); }
  .register-link a { color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; }
  .register-link a:hover { color: var(--accent); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="left-logo">★ LOGO</div>
  <div class="left-copy">
    <h1 class="left-title">歡迎!</h1>
    <p class="left-subtitle">KOC 平台名稱</p>
  </div>
  <div class="left-image">
    <svg fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="form-wrap">
    <h2 class="form-title">歡迎回來！</h2>

    <!-- Email / Phone -->
    <div class="field">
      <label class="field-label">電子郵件 或 手機號碼</label>
      <input class="field-input" type="text" id="email" placeholder="請輸入電子郵件 或 手機號碼" oninput="validateEmail(this)">
    </div>

    <!-- Password -->
    <div class="field">
      <label class="field-label">密碼</label>
      <div class="pw-wrap">
        <input class="field-input" type="password" id="password" placeholder="請輸入密碼" oninput="validatePw(this)">
        <button class="pw-toggle" onclick="togglePw()" type="button">
          <svg id="eyeIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="forgot-row"><span class="forgot-link">忘記密碼？</span></div>
    </div>

    <!-- Social -->
    <div class="social-divider"><span>或 由其他管道登入</span></div>
    <div class="social-row">
      <button class="social-btn" title="Google"><span class="g-icon">G</span></button>
      <button class="social-btn apple-icon" title="Apple">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      </button>
      <button class="social-btn" title="Facebook"><span class="fb-icon">f</span></button>
    </div>

    <!-- Submit -->
    <button class="submit-btn" onclick="handleLogin()">登入</button>

    <p class="register-link">還沒有帳號? <a href="#">註冊帳號</a></p>
  </div>
</div>

<script>
  function validateEmail(el) {
    const v = el.value.trim();
    el.classList.toggle('valid', v.length > 3);
    el.classList.remove('error');
  }
  function validatePw(el) {
    el.classList.toggle('valid', el.value.length >= 1);
    el.classList.remove('error');
  }
  let pwVisible = false;
  function togglePw() {
    pwVisible = !pwVisible;
    const pw = document.getElementById('password');
    pw.type = pwVisible ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
  function handleLogin() {
    const email = document.getElementById('email');
    const pw = document.getElementById('password');
    let ok = true;
    if (email.value.trim().length < 4) { email.classList.add('error'); ok = false; }
    if (pw.value.length < 1) { pw.classList.add('error'); ok = false; }
    if (!ok) return;
    const btn = document.querySelector('.submit-btn');
    btn.textContent = '登入中...';
    btn.style.opacity = '0.7';
    setTimeout(() => { btn.textContent = '✓ 登入成功！'; btn.style.background = '#6BBF6B'; btn.style.opacity = '1'; }, 1200);
  }
</script>
</body>
</html>
