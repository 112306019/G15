<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的點數 — SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --ink: #1A1A18;
    --warm-gray: #8C8880;
    --accent: #C8522A;
    --border: #E2DDD4;
    --gold: #B89B6A;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: 'Noto Serif TC', serif; min-height: 100vh; }

  /* NAV */
  nav {
    background: var(--cream); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 48px; height: 60px;
    position: sticky; top: 0; z-index: 100; gap: 32px;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-family: 'DM Serif Display', serif; font-size: 18px; letter-spacing: 0.08em; border: 1.5px solid var(--ink); padding: 6px 20px; border-radius: 40px; cursor: pointer; transition: all 0.2s; white-space: nowrap; background: var(--ink); color: var(--cream); }
  .logo:hover { background: var(--accent); border-color: var(--accent); }
  .nav-divider { width: 1px; height: 24px; background: var(--border); }
  .nav-link { font-size: 13px; color: var(--warm-gray); cursor: pointer; transition: color 0.2s; letter-spacing: 0.05em; }
  .nav-link:hover { color: var(--ink); }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .cart-btn { position: relative; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .cart-btn svg { width: 22px; height: 22px; }
  .cart-badge { position: absolute; top: -2px; right: -2px; background: var(--accent); color: white; font-family: 'Space Mono', monospace; font-size: 9px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .user-btn { cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .user-btn svg { width: 22px; height: 22px; }

  /* PAGE */
  .page { max-width: 1000px; margin: 0 auto; padding: 48px 24px 80px; display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }

  /* SIDEBAR */
  .sidebar { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 8px 0; position: sticky; top: 80px; }
  .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 13px 20px; font-size: 14px; color: var(--warm-gray); cursor: pointer; transition: all 0.2s; position: relative; }
  .sidebar-item:hover { color: var(--ink); background: var(--cream); }
  .sidebar-item.active { color: var(--ink); font-weight: 700; }
  .sidebar-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: var(--ink); border-radius: 0 2px 2px 0; }
  .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* CONTENT */
  .content { display: flex; flex-direction: column; gap: 32px; }

  .page-title { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--ink); }

  /* Points card */
  .points-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 24px 28px; }
  .card-section-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 16px; letter-spacing: 0.02em; }
  .points-value { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .points-expiry { font-size: 12px; color: var(--warm-gray); }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* Redeem row */
  .redeem-row { display: flex; align-items: center; justify-content: space-between; }
  .redeem-label { font-size: 14px; color: var(--ink); }
  .detail-btn { background: transparent; border: 1.5px solid var(--border); color: var(--ink); padding: 8px 18px; border-radius: 40px; font-family: 'Noto Serif TC', serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .detail-btn:hover { border-color: var(--ink); background: var(--cream); }

  /* Points history */
  .history-card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .history-header { padding: 20px 28px 0; }
  .history-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-top: 1px solid var(--border); transition: background 0.15s; }
  .history-row:hover { background: #FDFAF6; }
  .history-order { font-size: 14px; color: var(--ink); }
  .points-badge { background: var(--cream); border: 1.5px solid var(--border); color: var(--ink); font-family: 'Space Mono', monospace; font-size: 12px; padding: 5px 14px; border-radius: 40px; white-space: nowrap; }
  .points-badge.positive { border-color: var(--gold); color: var(--gold); background: #FBF6EE; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <div class="logo"><span>★</span> LOGO</div>
  <div class="nav-divider"></div>
  <span class="nav-link">首頁</span>
  <div class="nav-actions">
    <div class="cart-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-badge">2</span>
    </div>
    <div class="user-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</nav>

<div class="page">

  <aside class="sidebar">
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>個人資訊
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>登入與安全性
    </div>
    <div class="sidebar-item active">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>我的點數
    </div>
    <div class="sidebar-item">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>我的訂單
    </div>
  </aside>

  <div class="content">
    <h1 class="page-title">我的點數</h1>

    <!-- Current points -->
    <div class="points-card">
      <div class="card-section-title">目前擁有點數</div>
      <div class="points-value">30點</div>
      <div class="points-expiry">30天內即將到期點數：5點</div>

      <div class="divider"></div>

      <div class="redeem-row">
        <span class="redeem-label">兌換禮品</span>
        <button class="detail-btn">詳細頁面</button>
      </div>
    </div>

    <!-- Points history -->
    <div class="history-card">
      <div class="history-header">
        <div class="card-section-title">點數明細</div>
      </div>
      <div class="history-row">
        <span class="history-order">訂單 #96459761</span>
        <span class="points-badge positive">獲得 1 點</span>
      </div>
      <div class="history-row">
        <span class="history-order">訂單 #71667167</span>
        <span class="points-badge positive">獲得 2 點</span>
      </div>
      <div class="history-row">
        <span class="history-order">訂單 #51746385</span>
        <span class="points-badge positive">獲得 1 點</span>
      </div>
    </div>
  </div>

</div>

<script>
  document.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', function() {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      this.classList.add('active');
    });
  });
</script>
</body>
</html>
