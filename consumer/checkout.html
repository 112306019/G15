<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結帳 — SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --ink: #1A1A18;
    --warm-gray: #8C8880;
    --accent: #C8522A;
    --accent-light: #E8C4B4;
    --card-bg: #FDFAF6;
    --border: #E2DDD4;
    --gold: #B89B6A;
    --white: #FFFFFF;
    --green: #6BBF6B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 48px; height: 60px;
    position: sticky; top: 0; z-index: 100; gap: 32px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-family: 'DM Serif Display', serif;
    font-size: 18px; letter-spacing: 0.08em;
    border: 1.5px solid var(--ink);
    padding: 6px 20px; border-radius: 40px;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    background: var(--ink); color: var(--cream);
  }
  .logo:hover { background: var(--accent); border-color: var(--accent); }
  .nav-divider { width: 1px; height: 24px; background: var(--border); }
  .nav-links { display: flex; gap: 28px; }
  .nav-link { font-size: 13px; letter-spacing: 0.05em; color: var(--warm-gray); cursor: pointer; transition: color 0.2s; }
  .nav-link:hover { color: var(--ink); }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .cart-btn { position: relative; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .cart-btn svg { width: 22px; height: 22px; }
  .cart-badge {
    position: absolute; top: -2px; right: -2px;
    background: var(--accent); color: white;
    font-family: 'Space Mono', monospace; font-size: 9px;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .user-btn { cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .user-btn svg { width: 22px; height: 22px; }

  /* ── LAYOUT ── */
  .page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 56px;
    align-items: start;
  }

  /* ── LEFT ── */
  .left {}

  .page-title {
    font-family: 'DM Serif Display', serif;
    font-size: 40px; color: var(--ink);
    margin-bottom: 28px;
  }

  .divider { height: 1px; background: var(--border); margin-bottom: 28px; }

  /* Payment method section */
  .section-title {
    font-size: 18px; font-weight: 700;
    color: var(--ink); margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .method-badge {
    background: var(--ink); color: var(--cream);
    font-size: 12px; letter-spacing: 0.06em;
    padding: 5px 14px; border-radius: 40px;
    font-family: 'Space Mono', monospace;
  }

  .saved-label {
    font-size: 12px; color: var(--warm-gray);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 12px;
  }

  .view-all-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--warm-gray); color: var(--cream);
    border: none; padding: 10px 20px; border-radius: 40px;
    font-family: 'Noto Serif TC', serif; font-size: 13px;
    cursor: pointer; transition: background 0.2s;
    margin-bottom: 28px;
  }
  .view-all-btn:hover { background: var(--ink); }
  .view-all-btn svg { width: 14px; height: 14px; }

  /* Card form section */
  .card-section-title {
    font-size: 16px; font-weight: 700;
    color: var(--ink); margin-bottom: 24px;
    font-family: 'DM Serif Display', serif;
  }

  /* Form */
  .form-group { margin-bottom: 20px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }

  .field-label {
    display: block;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--warm-gray); margin-bottom: 8px;
  }

  .field-wrap { position: relative; }

  .field-input {
    width: 100%;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 44px 13px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 14px; color: var(--ink);
    outline: none; transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }
  .field-input::placeholder {
    color: var(--border);
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; letter-spacing: 0.02em;
  }
  .field-input:focus { border-color: var(--ink); }
  .field-input.valid { border-color: var(--green); }

  .field-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--green); display: none;
  }
  .field-icon svg { width: 18px; height: 18px; }
  .field-input.valid ~ .field-icon { display: flex; }

  /* Checkbox */
  .checkbox-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px; cursor: pointer;
  }
  .checkbox {
    width: 20px; height: 20px; border-radius: 5px;
    border: 1.5px solid var(--border);
    background: white; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; cursor: pointer;
  }
  .checkbox.checked { background: var(--ink); border-color: var(--ink); }
  .checkbox svg { width: 12px; height: 12px; color: white; display: none; }
  .checkbox.checked svg { display: block; }
  .checkbox-label { font-size: 14px; color: var(--ink); cursor: pointer; }

  /* Submit */
  .submit-btn {
    background: var(--ink); color: var(--cream);
    border: none; padding: 15px 36px;
    border-radius: 40px;
    font-family: 'Noto Serif TC', serif;
    font-size: 16px; letter-spacing: 0.05em;
    cursor: pointer; transition: all 0.25s;
    display: flex; align-items: center; gap: 10px;
  }
  .submit-btn:hover { background: var(--accent); transform: translateY(-1px); }
  .submit-btn svg { width: 18px; height: 18px; }

  /* ── RIGHT: ORDER SUMMARY ── */
  .summary {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: sticky;
    top: 80px;
  }

  .summary-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; color: var(--ink);
    margin-bottom: 24px;
    position: relative; display: inline-block;
  }
  .summary-title::after {
    content: ''; position: absolute; left: 0; bottom: -4px;
    width: 28px; height: 2px; background: var(--gold); border-radius: 2px;
  }

  .summary-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--warm-gray);
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .summary-line:last-of-type { border-bottom: none; }
  .summary-line .amount {
    font-family: 'Space Mono', monospace;
    color: var(--ink); font-size: 13px;
  }

  .summary-total {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--cream); border-radius: 10px;
    padding: 14px 16px; margin-top: 16px;
  }
  .summary-total-label {
    font-size: 13px; color: var(--ink); font-weight: 700;
  }
  .summary-total-label span {
    font-size: 11px; color: var(--warm-gray); font-weight: 400; margin-left: 4px;
  }
  .summary-total-amount {
    font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 700; color: var(--ink);
  }

  /* secure badge */
  .secure-badge {
    display: flex; align-items: center; gap: 8px;
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--warm-gray);
    letter-spacing: 0.05em;
  }
  .secure-badge svg { width: 14px; height: 14px; color: var(--green); }

  /* Payment method tabs */
  .method-tabs {
    display: flex; gap: 10px; margin-bottom: 28px;
  }
  .method-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 40px;
    border: 1.5px solid var(--border);
    font-size: 13px; cursor: pointer; transition: all 0.2s;
    color: var(--warm-gray); background: white;
  }
  .method-tab.active { border-color: var(--ink); color: var(--ink); background: var(--cream); }
  .method-tab svg { width: 16px; height: 16px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo"><span>★</span> LOGO</div>
  <div class="nav-divider"></div>
  <div class="nav-links">
    <span class="nav-link">Home</span>
    <span class="nav-link">Discover</span>
    <span class="nav-link">Blog</span>
    <span class="nav-link">About Us</span>
    <span class="nav-link">Contact</span>
  </div>
  <div class="nav-actions">
    <div class="cart-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-badge">2</span>
    </div>
    <div class="user-btn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</nav>

<!-- PAGE -->
<div class="page">

  <!-- LEFT -->
  <div class="left">
    <h1 class="page-title">結帳</h1>
    <div class="divider"></div>

    <!-- Payment Method -->
    <div class="section-title">
      支付方式
      <span class="method-badge">信用卡</span>
    </div>

    <!-- Method tabs -->
    <div class="method-tabs">
      <button class="method-tab active" onclick="selectMethod(this)">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        信用卡
      </button>
      <button class="method-tab" onclick="selectMethod(this)">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M7 10h10M7 14h6"/></svg>
        轉帳
      </button>
      <button class="method-tab" onclick="selectMethod(this)">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        貨到付款
      </button>
    </div>

    <p class="saved-label">已儲存資訊</p>
    <button class="view-all-btn">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      查看全部
    </button>

    <div class="divider"></div>

    <p class="card-section-title">Credit Card</p>

    <!-- Card Number -->
    <div class="form-group">
      <label class="field-label">信用卡號</label>
      <div class="field-wrap">
        <input class="field-input valid" type="text" id="cardNum" value="999999999999" oninput="formatCard(this)" maxlength="19">
        <span class="field-icon">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </div>
    </div>

    <!-- Cardholder -->
    <div class="form-group">
      <label class="field-label">持卡人姓名</label>
      <div class="field-wrap">
        <input class="field-input" type="text" id="cardName" placeholder="PHAM TRAN LAN CAM NGOC" style="font-family:'Noto Serif TC',serif;letter-spacing:0.02em">
        <span class="field-icon">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </div>
    </div>

    <!-- Expiry + CVC -->
    <div class="form-row">
      <div>
        <label class="field-label">到期日</label>
        <div class="field-wrap">
          <input class="field-input" type="text" id="expiry" placeholder="MM / YY" maxlength="7" oninput="formatExpiry(this)">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>
      </div>
      <div>
        <label class="field-label">CVC</label>
        <div class="field-wrap">
          <input class="field-input" type="password" id="cvc" placeholder="•••" maxlength="4" oninput="validateCVC(this)">
          <span class="field-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Save info -->
    <div class="checkbox-row" onclick="toggleCheck()">
      <div class="checkbox checked" id="saveCheck">
        <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span class="checkbox-label">儲存資訊</span>
    </div>

    <!-- Submit -->
    <button class="submit-btn" onclick="handleSubmit()">
      確認並支付
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- RIGHT: Summary -->
  <div class="summary">
    <div class="summary-title">付款詳情</div>

    <div class="summary-line">
      <span>$20 x 2</span>
      <span class="amount">$40</span>
    </div>
    <div class="summary-line">
      <span>運費</span>
      <span class="amount">$0.00</span>
    </div>
    <div class="summary-line">
      <span>優惠碼折扣</span>
      <span class="amount" style="color:var(--green)">−$3.40</span>
    </div>
    <div class="summary-line">
      <span>點數折抵</span>
      <span class="amount" style="color:var(--green)">−$7.66</span>
    </div>

    <div class="summary-total">
      <div class="summary-total-label">
        總付款金額 <span>(USD)</span>
      </div>
      <div class="summary-total-amount">$68.94</div>
    </div>

    <div class="secure-badge">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      SSL 加密安全付款保障
    </div>
  </div>

</div>

<script>
  function selectMethod(el) {
    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    // Update badge
    document.querySelector('.method-badge').textContent = el.textContent.trim();
  }

  function formatCard(el) {
    let v = el.value.replace(/\D/g, '').substring(0, 16);
    el.value = v.replace(/(.{4})/g, '$1 ').trim();
    el.classList.toggle('valid', v.length >= 16);
  }

  function formatExpiry(el) {
    let v = el.value.replace(/\D/g, '').substring(0, 4);
    if (v.length >= 2) v = v.substring(0,2) + ' / ' + v.substring(2);
    el.value = v;
    el.classList.toggle('valid', v.replace(/\D/g,'').length >= 4);
  }

  function validateCVC(el) {
    el.classList.toggle('valid', el.value.length >= 3);
  }

  // Auto-validate name
  document.getElementById('cardName').addEventListener('input', function() {
    this.classList.toggle('valid', this.value.trim().length >= 3);
  });

  let checked = true;
  function toggleCheck() {
    checked = !checked;
    document.getElementById('saveCheck').classList.toggle('checked', checked);
  }

  function handleSubmit() {
    const btn = document.querySelector('.submit-btn');
    btn.style.background = 'var(--green)';
    btn.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> 付款成功！`;
    setTimeout(() => {
      btn.style.background = '';
      btn.innerHTML = `確認並支付 <svg fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }, 2000);
  }
</script>
</body>
</html>
