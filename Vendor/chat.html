<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOCMART — 訊息中心</title>
<link rel="stylesheet" href="shared.css">
<style>
/* override content padding for full-height chat */
.content { padding: 0 !important; flex: 1; display: flex; overflow: hidden; height: calc(100vh - 60px); }

/* ── CHAT LAYOUT ── */
.chat-layout { display: flex; width: 100%; height: 100%; overflow: hidden; }

/* ── CONVERSATION LIST ── */
.conv-list {
  width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--surface);
}
.conv-search-wrap { padding: 14px; border-bottom: 1px solid var(--border); }
.conv-search {
  width: 100%; padding: 8px 14px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; transition: border-color .2s;
}
.conv-search:focus { border-color: var(--accent); }

.conv-tabs { display: flex; border-bottom: 1px solid var(--border); }
.conv-tab {
  flex: 1; padding: 10px; text-align: center; font-size: 12px;
  color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all .2s;
}
.conv-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.conv-items { flex: 1; overflow-y: auto; }

.conv-item {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; cursor: pointer; transition: background .15s;
  border-bottom: 1px solid rgba(255,255,255,.03); position: relative;
}
.conv-item:hover { background: var(--surface2); }
.conv-item.active { background: rgba(124,92,252,.1); }
.conv-item.unread .conv-name { font-weight: 700; }

.conv-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; position: relative;
}
.online-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--green);
  position: absolute; bottom: 0; right: 0; border: 2px solid var(--surface);
}
.offline-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--border);
  position: absolute; bottom: 0; right: 0; border: 2px solid var(--surface);
}
.conv-meta { flex: 1; min-width: 0; }
.conv-name { font-size: 13px; }
.conv-preview { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.conv-right { text-align: right; flex-shrink: 0; }
.conv-time { font-size: 10px; color: var(--text2); font-family: 'Space Mono', monospace; }
.conv-badge {
  display: inline-block; background: var(--accent2); color: #fff;
  font-size: 10px; padding: 1px 6px; border-radius: 10px;
  margin-top: 4px; font-family: 'Space Mono', monospace;
}

/* ── CHAT PANEL ── */
.chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

.chat-topbar {
  height: 60px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0;
}
.chat-topbar-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
.chat-topbar-name { font-size: 14px; font-weight: 600; }
.chat-topbar-status { font-size: 11px; color: var(--green); }
.chat-topbar-actions { margin-left: auto; display: flex; gap: 8px; }
.chat-action-btn {
  width: 32px; height: 32px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; transition: background .15s;
}
.chat-action-btn:hover { background: var(--border); }

/* MESSAGES */
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.msg-group { display: flex; flex-direction: column; gap: 4px; }
.msg-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-row.me { flex-direction: row-reverse; }

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}
.msg-avatar.spacer { opacity: 0; }

.bubble {
  max-width: 68%; padding: 10px 14px; border-radius: 14px;
  font-size: 13px; line-height: 1.55; position: relative;
  animation: fadeUp .2s ease both;
}
.bubble.them {
  background: var(--surface); border: 1px solid var(--border);
  border-bottom-left-radius: 4px; color: var(--text);
}
.bubble.me {
  background: linear-gradient(135deg, var(--accent), #8c6cfc);
  border-bottom-right-radius: 4px; color: #fff;
}
.bubble-time { font-size: 10px; margin-top: 4px; opacity: .55; display: block; }
.bubble.me .bubble-time { text-align: right; }

/* SYSTEM MESSAGE */
.sys-msg {
  text-align: center; font-size: 11px; color: var(--text2);
  display: flex; align-items: center; gap: 8px;
}
.sys-msg::before, .sys-msg::after { content:''; flex:1; height:1px; background:var(--border); }

/* CARD MESSAGE */
.bubble-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-top: 4px;
  font-size: 12px;
}
.bubble-card-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.bubble-card-row { display: flex; justify-content: space-between; color: var(--text2); margin-top: 2px; }
.bubble-card-row span:last-child { color: var(--text); font-family: 'Space Mono', monospace; }

/* QUICK REPLY */
.quick-replies { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 12px; }
.quick-reply {
  padding: 6px 14px; border-radius: 20px; font-size: 12px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; transition: all .15s;
}
.quick-reply:hover { border-color: var(--accent); color: var(--accent); }

/* INPUT AREA */
.chat-input-wrap {
  padding: 14px 20px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
.chat-attach-btn {
  width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: background .15s;
}
.chat-attach-btn:hover { background: var(--border); }
.chat-input {
  flex: 1; padding: 10px 14px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; resize: none; max-height: 120px; transition: border-color .2s;
  line-height: 1.5;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
  width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #9c5cfc);
  border: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: opacity .15s;
}
.send-btn:hover { opacity: .85; }

/* RIGHT PANEL — KOC INFO */
.koc-info-panel {
  width: 260px; flex-shrink: 0; border-left: 1px solid var(--border);
  background: var(--surface); display: flex; flex-direction: column;
  overflow-y: auto;
}
.koc-info-top { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
.koc-info-avatar {
  width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700;
}
.koc-info-name { font-size: 15px; font-weight: 700; }
.koc-info-handle { font-size: 12px; color: var(--text2); margin-top: 2px; }
.koc-info-body { padding: 16px; }
.info-section { margin-bottom: 18px; }
.info-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text2); margin-bottom: 8px; }
.info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.info-row:last-child { border-bottom: none; }
.info-row-label { color: var(--text2); }
.info-row-value { font-weight: 500; font-family: 'Space Mono', monospace; font-size: 12px; }

.koc-info-actions { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }

/* EMPTY STATE */
.chat-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--text2);
}
.chat-empty-icon { font-size: 48px; opacity: .4; }
.chat-empty-text { font-size: 14px; }
</style>
</head>
<body>
<aside class="sidebar" id="sidebar-mount"></aside>

<div class="main">
  <div class="topbar">
    <div class="page-title">💬 訊息中心</div>
    <div class="topbar-actions">
      <div class="notif-btn" onclick="showToast('您有 3 則新通知')">🔔<span class="notif-dot"></span></div>
      <button class="btn-primary" onclick="openModal('broadcastModal')">📢 群發訊息</button>
    </div>
  </div>

  <div class="content">
    <div class="chat-layout">

      <!-- CONVERSATION LIST -->
      <div class="conv-list">
        <div class="conv-search-wrap">
          <input class="conv-search" placeholder="🔍 搜尋 KOC...">
        </div>
        <div class="conv-tabs">
          <div class="conv-tab active" onclick="switchConvTab(this)">全部</div>
          <div class="conv-tab" onclick="switchConvTab(this)">未讀 <span style="color:var(--accent2)">(3)</span></div>
          <div class="conv-tab" onclick="switchConvTab(this)">群組</div>
        </div>
        <div class="conv-items" id="convList">
          <!-- items injected by JS -->
        </div>
      </div>

      <!-- MAIN CHAT PANEL -->
      <div class="chat-panel" id="chatPanel">
        <div class="chat-topbar" id="chatTopbar">
          <div class="chat-topbar-avatar" id="topbarAvatar" style="background:linear-gradient(135deg,#fc5ca0,#ff8c69)">萱</div>
          <div>
            <div class="chat-topbar-name" id="topbarName">林小萱</div>
            <div class="chat-topbar-status" id="topbarStatus">● 線上</div>
          </div>
          <div class="chat-topbar-actions">
            <div class="chat-action-btn" title="查看 KOC 資料" onclick="toggleKocPanel()">👤</div>
            <div class="chat-action-btn" title="搜尋訊息">🔍</div>
            <div class="chat-action-btn" title="更多" onclick="showToast('更多選項')">⋯</div>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages">
          <!-- messages injected by JS -->
        </div>

        <div class="quick-replies" id="quickReplies">
          <div class="quick-reply" onclick="sendQuickReply(this)">感謝您的努力！🎉</div>
          <div class="quick-reply" onclick="sendQuickReply(this)">已為您更新優惠碼</div>
          <div class="quick-reply" onclick="sendQuickReply(this)">請查看最新活動資訊</div>
          <div class="quick-reply" onclick="sendQuickReply(this)">傭金本週發放 💰</div>
        </div>

        <div class="chat-input-wrap">
          <div class="chat-input-row">
            <div class="chat-attach-btn" onclick="showToast('選擇檔案或圖片')">📎</div>
            <textarea class="chat-input" id="chatInput" rows="1" placeholder="輸入訊息..." onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      </div>

      <!-- KOC INFO PANEL -->
      <div class="koc-info-panel" id="kocInfoPanel">
        <div class="koc-info-top">
          <div class="koc-info-avatar" style="background:linear-gradient(135deg,#fc5ca0,#ff8c69)" id="infoAvatar">萱</div>
          <div class="koc-info-name" id="infoName">林小萱</div>
          <div class="koc-info-handle" id="infoHandle">@xiaoXuan.beauty</div>
          <div style="margin-top:8px"><span class="pill pill-green">啟用中</span></div>
        </div>
        <div class="koc-info-body">
          <div class="info-section">
            <div class="info-section-title">本月業績</div>
            <div class="info-row"><span class="info-row-label">帶動訂單</span><span class="info-row-value">486 筆</span></div>
            <div class="info-row"><span class="info-row-label">帶動營收</span><span class="info-row-value" style="color:var(--gold)">$62,400</span></div>
            <div class="info-row"><span class="info-row-label">傭金累積</span><span class="info-row-value" style="color:var(--green)">$6,240</span></div>
            <div class="info-row"><span class="info-row-label">轉換率</span><span class="info-row-value">8.4%</span></div>
          </div>
          <div class="info-section">
            <div class="info-section-title">優惠碼</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <span class="code-pill">MEIYAN30</span>
            </div>
          </div>
          <div class="info-section">
            <div class="info-section-title">加入資訊</div>
            <div class="info-row"><span class="info-row-label">加入日期</span><span class="info-row-value">2024/01/15</span></div>
            <div class="info-row"><span class="info-row-label">累計訂單</span><span class="info-row-value">1,248 筆</span></div>
            <div class="info-row"><span class="info-row-label">傭金率</span><span class="info-row-value">10%</span></div>
          </div>
        </div>
        <div class="koc-info-actions">
          <button class="btn-secondary" style="font-size:12px;padding:8px;text-align:center" onclick="location.href='koc.html'">查看 KOC 詳情</button>
          <button class="btn-secondary" style="font-size:12px;padding:8px;text-align:center" onclick="location.href='coupon.html'">管理優惠碼</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- BROADCAST MODAL -->
<div class="modal-overlay" id="broadcastModal" onclick="if(event.target===this)closeModal('broadcastModal')">
  <div class="modal">
    <div class="modal-title">📢 群發訊息</div>
    <div class="modal-sub">一次傳送訊息給多位 KOC</div>
    <div class="form-group">
      <label class="form-label">收件對象</label>
      <select class="form-select">
        <option>所有 KOC（87 位）</option>
        <option>啟用中 KOC（72 位）</option>
        <option>本月業績前 10 名</option>
        <option>自訂名單</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">訊息內容</label>
      <textarea class="form-input" rows="4" placeholder="輸入群發訊息內容..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">附加優惠碼（可選）</label>
      <select class="form-select">
        <option>— 不附加 —</option>
        <option>MEIYAN30</option>
        <option>SUMMER20</option>
        <option>BELLE10</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('broadcastModal')">取消</button>
      <button class="btn-primary" onclick="closeModal('broadcastModal');showToast('✅ 群發訊息已送出！')">確認發送</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
renderSidebar('chat');

const conversations = [
  { id: 1, name:'林小萱', handle:'@xiaoXuan.beauty', initials:'萱', bg:'linear-gradient(135deg,#fc5ca0,#ff8c69)', online:true, unread:2, time:'剛剛', preview:'好的！我明天就發佈 👍', active:true },
  { id: 2, name:'陳雅君', handle:'@yajun.lifestyle', initials:'雅', bg:'linear-gradient(135deg,#7c5cfc,#5ca0fc)', online:true, unread:1, time:'5分前', preview:'請問傭金什麼時候發放？' },
  { id: 3, name:'王芸芸',  handle:'@yun2_beauty',    initials:'芸', bg:'linear-gradient(135deg,#2ecc8a,#5cf0b0)', online:false, unread:0, time:'1時前', preview:'謝謝！收到了 😊' },
  { id: 4, name:'張佳佳', handle:'@jia2.skin',       initials:'佳', bg:'linear-gradient(135deg,#f5c842,#fc8c5c)', online:false, unread:0, time:'昨天',  preview:'我需要新的優惠碼' },
  { id: 5, name:'李欣怡', handle:'@xinyi.glow',      initials:'欣', bg:'linear-gradient(135deg,#5c8cfc,#9c5cfc)', online:true, unread:0, time:'昨天',  preview:'好的，我了解了！' },
  { id: 6, name:'周美玲', handle:'@meiling.daily',   initials:'玲', bg:'linear-gradient(135deg,#fc5ca0,#f5c842)', online:false, unread:0, time:'2天前',  preview:'申請已送出，謝謝！' },
  { id: 7, name:'春季活動群組', handle:'18 位 KOC', initials:'春', bg:'linear-gradient(135deg,#7c5cfc,#fc5ca0)', online:false, unread:3, time:'10分前', preview:'[活動] 春季美肌節物料更新' },
];

const messagesByConv = {
  1: [
    { type:'sys', text:'今天' },
    { from:'them', text:'你好！我想詢問一下，MEIYAN30 的優惠碼還有效嗎？', time:'10:12' },
    { from:'me',   text:'您好！MEIYAN30 目前有效，可以繼續使用，到期日是 6/30 哦 😊', time:'10:15' },
    { from:'them', text:'太好了！那我今天就來安排新的一篇開箱分享', time:'10:18' },
    { from:'me',   text:'非常感謝您的支持！\n\n這裡附上最新的商品資料和圖片，方便您製作內容：', time:'10:20',
      card:{ title:'🧴 玫瑰胜肽精華液 50ml', rows:[['優惠價','$896 (30% off)'],['優惠碼','MEIYAN30'],['到期日','2025/06/30']] } },
    { from:'them', text:'收到！我會盡快準備好內容，可能明後天就會發佈囉 🌸', time:'10:45' },
    { from:'me',   text:'期待您的作品！如果需要任何素材請隨時告訴我', time:'10:46' },
    { type:'sys',  text:'下午' },
    { from:'them', text:'對了，請問這個月的傭金結算是哪天呢？', time:'14:30' },
    { from:'me',   text:'本月傭金結算日為 4/1，您目前累積了 $6,240，會在結算日直接轉入您的帳戶 💰', time:'14:33' },
    { from:'them', text:'好的！我明天就發佈 👍', time:'14:35' },
  ]
};

let currentConv = 1;
let kocPanelOpen = true;

function renderConvList() {
  const list = document.getElementById('convList');
  list.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.unread ? 'unread' : ''} ${c.id === currentConv ? 'active' : ''}"
         onclick="selectConv(${c.id})">
      <div class="conv-avatar" style="background:${c.bg}">
        ${c.initials}
        <div class="${c.online ? 'online-dot' : 'offline-dot'}"></div>
      </div>
      <div class="conv-meta">
        <div class="conv-name">${c.name}</div>
        <div class="conv-preview">${c.preview}</div>
      </div>
      <div class="conv-right">
        <div class="conv-time">${c.time}</div>
        ${c.unread ? `<div class="conv-badge">${c.unread}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function selectConv(id) {
  currentConv = id;
  const conv = conversations.find(c => c.id === id);
  conv.unread = 0;
  renderConvList();

  // update topbar
  document.getElementById('topbarAvatar').style.background = conv.bg;
  document.getElementById('topbarAvatar').textContent = conv.initials;
  document.getElementById('topbarName').textContent = conv.name;
  document.getElementById('topbarStatus').textContent = conv.online ? '● 線上' : '○ 離線';
  document.getElementById('topbarStatus').style.color = conv.online ? 'var(--green)' : 'var(--text2)';

  // update koc panel
  document.getElementById('infoAvatar').style.background = conv.bg;
  document.getElementById('infoAvatar').textContent = conv.initials;
  document.getElementById('infoName').textContent = conv.name;
  document.getElementById('infoHandle').textContent = conv.handle;

  renderMessages(id);
}

function renderMessages(id) {
  const msgs = messagesByConv[id] || [
    { type:'sys', text:'今天' },
    { from:'them', text:'您好！', time:'09:00' }
  ];
  const container = document.getElementById('chatMessages');
  container.innerHTML = msgs.map((m, i) => {
    if (m.type === 'sys') return `<div class="sys-msg">${m.text}</div>`;
    const isMe = m.from === 'me';
    const showAvatar = !isMe && (i === 0 || msgs[i-1].from !== 'them');
    const conv = conversations.find(c => c.id === currentConv);
    const avatar = showAvatar
      ? `<div class="msg-avatar" style="background:${conv.bg}">${conv.initials}</div>`
      : `<div class="msg-avatar spacer"></div>`;
    let cardHtml = '';
    if (m.card) {
      cardHtml = `<div class="bubble-card">
        <div class="bubble-card-title">${m.card.title}</div>
        ${m.card.rows.map(r => `<div class="bubble-card-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}
      </div>`;
    }
    return `
      <div class="msg-group">
        <div class="msg-row ${isMe ? 'me' : ''}">
          ${isMe ? '' : avatar}
          <div class="bubble ${isMe ? 'me' : 'them'}">
            ${m.text.replace(/\n/g,'<br>')}
            ${cardHtml}
            <span class="bubble-time">${m.time}</span>
          </div>
          ${isMe ? '' : ''}
        </div>
      </div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const now = new Date();
  const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  if (!messagesByConv[currentConv]) messagesByConv[currentConv] = [];
  messagesByConv[currentConv].push({ from:'me', text, time });

  // update preview
  const conv = conversations.find(c => c.id === currentConv);
  if (conv) conv.preview = text.substring(0,30) + (text.length>30?'…':'');
  renderConvList();
  renderMessages(currentConv);
  input.value = '';
  input.style.height = 'auto';
}

function sendQuickReply(el) {
  document.getElementById('chatInput').value = el.textContent;
  sendMessage();
}

function handleEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function switchConvTab(el) {
  document.querySelectorAll('.conv-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function toggleKocPanel() {
  const panel = document.getElementById('kocInfoPanel');
  kocPanelOpen = !kocPanelOpen;
  panel.style.display = kocPanelOpen ? '' : 'none';
}

// INIT
renderConvList();
renderMessages(1);
</script>
</body>
</html>
