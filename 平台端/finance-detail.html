<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交易明細 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>
      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <button onclick="window.location.href='finance.html'" class="text-gray-500 hover:text-black flex items-center text-sm font-medium mb-4">
      <span class="mr-2">←</span> 返回金流列表
    </button>

    <h1 class="text-3xl font-bold">交易明細</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8 relative">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
          <p class="text-gray-500 font-medium">資料讀取中...</p>
        </div>

        <div class="flex justify-between items-end border-b pb-4">
          <h2 class="text-xl font-bold">交易資訊</h2>
          <p class="text-sm text-gray-400">單號：<span id="txId" class="font-mono text-gray-600">-</span></p>
        </div>
        
        <div class="space-y-4 text-sm">
          <p><span class="text-gray-500 inline-block w-24">交易時間：</span> <span id="txDate">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">交易類型：</span> <span id="txTypeBadge">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">交易金額：</span> <span id="txAmount" class="text-xl font-bold">-</span></p>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">對象與帳戶資訊</p>
          <p><span class="text-gray-500 inline-block w-24">交易對象：</span> <span id="txTarget" class="font-medium">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">帳戶資訊：</span> <span id="txAccount" class="font-mono bg-gray-50 px-2 py-1 rounded border border-gray-200">-</span></p>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">關聯系統資訊</p>
          <p><span class="text-gray-500 inline-block w-24">關聯任務：</span> <span id="txTask" class="text-blue-600 cursor-pointer hover:underline">-</span></p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 h-fit space-y-6">
        <h2 class="text-xl font-bold border-b pb-4">交易狀態</h2>
        
        <div class="space-y-4 text-sm">
          <p><span class="text-gray-500 inline-block w-20">目前狀態：</span> <span id="statusBadge" class="font-semibold px-3 py-1 rounded-full bg-gray-100">-</span></p>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function fetchFinanceDetail() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const txId = urlParams.get('id');

        setTimeout(() => {
          // 模擬資料庫
          const mockDatabase = {
            'TX260228001': { id: 'TX260228001', date: '2026/02/28 10:15', target: '極速科技公司', task: '春季彩妝新品體驗', type: 'income', amount: 15000, status: 'completed', account: '玉山銀行 (808) 1234-***-5678' },
            'TX260225010': { id: 'TX260225010', date: '2026/02/25 09:00', target: '美味餐飲企業', task: '信義區新開幕拉麵', type: 'income', amount: 5000, status: 'completed', account: '中國信託 (822) 9876-***-4321' },
            'TX260220012': { id: 'TX260220012', date: '2026/02/20 14:20', target: '愛玩客小林', task: '隱藏版甜點店探店', type: 'payout', amount: 2000, status: 'completed', account: '國泰世華 (013) 5555-***-6666' }
          };

          const txData = mockDatabase[txId];

          if (!txData) {
            alert("找不到這筆交易明細！");
            window.location.href = 'finance.html';
            return;
          }

          document.getElementById('txId').innerText = txData.id;
          document.getElementById('txDate').innerText = txData.date;
          document.getElementById('txTarget').innerText = txData.target;
          document.getElementById('txTask').innerText = txData.task;
          document.getElementById('txAccount').innerText = txData.account;

          // 處理類型標籤與金額顏色
          const typeBadge = document.getElementById('txTypeBadge');
          const amountElem = document.getElementById('txAmount');
          
          if (txData.type === 'income') {
            typeBadge.innerHTML = '<span class="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-semibold">入帳 (廠商付款)</span>';
            amountElem.innerText = `+$${txData.amount.toLocaleString()}`;
            amountElem.classList.add('text-green-600');
          } else {
            typeBadge.innerHTML = '<span class="text-purple-600 bg-purple-50 px-2 py-1 rounded text-xs font-semibold">出帳 (平台撥款)</span>';
            amountElem.innerText = `-$${txData.amount.toLocaleString()}`;
            amountElem.classList.add('text-red-500');
          }

          // 處理狀態標籤
          const statusBadge = document.getElementById('statusBadge');
          if (txData.status === 'completed') {
            statusBadge.innerText = '已完成';
            statusBadge.classList.add('text-green-600', 'bg-green-50');
          } else if (txData.status === 'pending') {
            statusBadge.innerText = '待處理';
            statusBadge.classList.add('text-orange-600', 'bg-orange-50');
          }

          document.getElementById('loadingOverlay').style.display = 'none';
        }, 500);
      } catch (error) {
        console.error("載入失敗");
      }
    }

    document.addEventListener('DOMContentLoaded', fetchFinanceDetail);
  </script>

</body>
</html>
