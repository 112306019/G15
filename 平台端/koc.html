<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOC 管理 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold">KOC 管理</h1>

    <div class="flex items-center justify-between bg-white p-4 rounded-t-xl border border-gray-200 border-b-0">
      
      <div class="relative w-64">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
        <input id="searchInput" type="text" placeholder="搜尋KOC姓名、社群帳號" class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>
      
      <div id="categoryFilters" class="flex space-x-6 text-sm text-gray-500">
        <button class="category-btn active text-black font-semibold border-b-2 border-black pb-1 transition-colors" data-category="all">全部</button>
        <button class="category-btn hover:text-black pb-1 transition-colors" data-category="美容">美容</button>
        <button class="category-btn hover:text-black pb-1 transition-colors" data-category="美食">美食</button>
        <button class="category-btn hover:text-black pb-1 transition-colors" data-category="3C">3C</button>
        <button class="category-btn hover:text-black pb-1 transition-colors" data-category="旅遊">旅遊</button>
        <button class="category-btn hover:text-black pb-1 transition-colors" data-category="時尚">時尚</button>
      </div>

      <select id="statusFilter" class="border border-gray-300 px-4 py-2 rounded-lg text-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-black cursor-pointer">
        <option value="all">狀態篩選 (全部)</option>
        <option value="pending">待審核</option>
        <option value="active">已啟用</option>
        <option value="suspended">已停權</option>
      </select>
    </div>

    <div class="bg-white border border-gray-200 rounded-b-xl overflow-hidden shadow-sm">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200 text-sm text-gray-500">
          <tr>
            <th class="py-4 px-6 font-medium">KOC姓名</th>
            <th class="py-4 px-6 font-medium">社群帳號</th>
            <th class="py-4 px-6 font-medium">主要平台</th>
            <th class="py-4 px-6 font-medium">標籤</th>
            <th class="py-4 px-6 font-medium">狀態</th>
            <th class="py-4 px-6 font-medium text-center">操作</th>
          </tr>
        </thead>
        <tbody id="kocTableBody" class="text-sm divide-y divide-gray-100">
          <tr>
            <td colspan="6" class="py-8 text-center text-gray-500">資料載入中...</td>
          </tr>
        </tbody>
      </table>
      
      <div class="py-4 text-center border-t border-gray-100">
        <button class="text-sm text-gray-500 hover:text-black">Load more 500+</button>
      </div>
    </div>
  </main>

  <script>
    // 儲存從資料庫抓回來的完整 KOC 資料
    let allKocData = [];

    // 記錄目前的三種篩選狀態
    let currentSearchTerm = '';
    let currentStatusFilter = 'all';
    let currentCategoryFilter = 'all';

    // 1. 模擬去後端抓資料
    async function fetchKocList() {
      try {
        setTimeout(() => {
          // 模擬資料庫回傳的 KOC 陣列 (注意欄位不一樣了)
          allKocData = [
            { id: 'K001', name: '王美美', handle: '@meimei_beauty', platform: 'Instagram', tags: ['美容', '時尚'], status: 'pending' },
            { id: 'K002', name: '吃貨阿翔', handle: '@xiang_eats', platform: 'Facebook', tags: ['美食', '探店'], status: 'active' },
            { id: 'K003', name: '科技酷哥', handle: '@cool_tech', platform: 'YouTube', tags: ['3C', '遊戲'], status: 'suspended' },
            { id: 'K004', name: '愛玩客小林', handle: '@lin_travel', platform: 'Instagram', tags: ['旅遊', '攝影'], status: 'active' },
            { id: 'K005', name: '時尚達人Lisa', handle: '@lisa_style', platform: 'Instagram', tags: ['時尚', '美容'], status: 'pending' },
            { id: 'K006', name: '拉麵控大叔', handle: '@ramen_uncle', platform: 'Facebook', tags: ['美食'], status: 'active' }
          ];
          // 抓到資料後，開始渲染
          applyFilters();
        }, 800);
      } catch (error) {
        document.getElementById('kocTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500">載入失敗</td></tr>';
      }
    }

    // 2. 綜合篩選邏輯 (支援 狀態 + 搜尋 + 分類標籤)
    function applyFilters() {
      let filteredData = allKocData;

      // 第一關：狀態篩選
      if (currentStatusFilter !== 'all') {
        filteredData = filteredData.filter(koc => koc.status === currentStatusFilter);
      }

      // 第二關：分類標籤篩選 (檢查該 KOC 的 tags 陣列裡有沒有包含選中的標籤)
      if (currentCategoryFilter !== 'all') {
        filteredData = filteredData.filter(koc => koc.tags.includes(currentCategoryFilter));
      }

      // 第三關：關鍵字搜尋 (搜姓名或帳號)
      if (currentSearchTerm.trim() !== '') {
        const keyword = currentSearchTerm.toLowerCase();
        filteredData = filteredData.filter(koc => 
          koc.name.toLowerCase().includes(keyword) ||
          koc.handle.toLowerCase().includes(keyword)
        );
      }

      // 把最後剩下的資料丟去畫表格
      renderTable(filteredData);
    }

    // 3. 畫出 HTML 表格
    function renderTable(dataArray) {
      const tbody = document.getElementById('kocTableBody');
      tbody.innerHTML = ''; 

      if (dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-500">找不到符合的 KOC 資料</td></tr>';
        return;
      }

      dataArray.forEach(koc => {
        let statusConfig = { text: '', colorClass: '', buttonHtml: '' };
        
        if (koc.status === 'pending') {
          statusConfig.text = '待審核';
          statusConfig.colorClass = 'text-orange-500';
          // 點擊後跳轉到 koc-review.html，並帶上 KOC 的 ID
          statusConfig.buttonHtml = `<button onclick="window.location.href='koc-review.html?id=${koc.id}'" class="bg-black text-white px-4 py-1.5 rounded-md hover:bg-gray-800 transition-colors text-sm">審核</button>`;
        } else if (koc.status === 'active') {
          statusConfig.text = '已啟用';
          statusConfig.colorClass = 'text-green-500';
          // 🌟 加上 onclick 事件，跳轉到 koc-detail.html
          statusConfig.buttonHtml = `<button onclick="window.location.href='koc-detail.html?id=${koc.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        } else if (koc.status === 'suspended') {
          statusConfig.text = '已停權';
          statusConfig.colorClass = 'text-red-500';
          // 🌟 一樣加上 onclick 事件
          statusConfig.buttonHtml = `<button onclick="window.location.href='koc-detail.html?id=${koc.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        }

        // 把 KOC 的 tags 陣列轉成逗號分隔的字串 (例如：美容, 時尚)
        const tagsString = koc.tags.join('、');

        const rowHtml = `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="py-4 px-6 font-medium">${koc.name}</td>
            <td class="py-4 px-6 text-gray-500">${koc.handle}</td>
            <td class="py-4 px-6">${koc.platform}</td>
            <td class="py-4 px-6">${tagsString}</td>
            <td class="py-4 px-6 font-semibold ${statusConfig.colorClass}">${statusConfig.text}</td>
            <td class="py-4 px-6 text-center">${statusConfig.buttonHtml}</td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    // --- 以下是監聽器綁定 ---

    // 4. 監聽下拉選單 (狀態)
    document.getElementById('statusFilter').addEventListener('change', function(event) {
      currentStatusFilter = event.target.value;
      applyFilters(); 
    });

    // 5. 監聽搜尋框 (關鍵字)
    document.getElementById('searchInput').addEventListener('input', function(event) {
      currentSearchTerm = event.target.value;
      applyFilters(); 
    });

    // 6. 監聽分類標籤點擊 (美容、美食...)
    const categoryBtns = document.querySelectorAll('.category-btn');
    categoryBtns.forEach(btn => {
      btn.addEventListener('click', function(event) {
        // 更新目前選中的分類變數
        currentCategoryFilter = event.target.getAttribute('data-category');
        
        // 改變按鈕的樣式 (把大家都變灰，只有被點到的變黑)
        categoryBtns.forEach(b => {
          b.classList.remove('text-black', 'font-semibold', 'border-b-2', 'border-black');
          b.classList.add('text-gray-500');
        });
        event.target.classList.remove('text-gray-500');
        event.target.classList.add('text-black', 'font-semibold', 'border-b-2', 'border-black');

        // 重新執行篩選
        applyFilters();
      });
    });

    // 啟動！
    document.addEventListener('DOMContentLoaded', fetchKocList);
  </script>

</body>
</html>
