<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廠商管理 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold">廠商管理</h1>

    <div class="flex items-center justify-between bg-white p-4 rounded-t-xl border border-gray-200 border-b-0">
      <div class="relative w-72">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
        <input id="searchInput" type="text" placeholder="搜尋廠商名稱、統編、聯絡人" class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>
      
      <select id="statusFilter" class="border border-gray-300 px-4 py-2 rounded-lg text-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-black cursor-pointer">
        <option value="all">狀態篩選 (全部)</option>
        <option value="pending">待審核</option>
        <option value="active">已啟用</option>
        <option value="suspended">已停權</option>
      </select>
    </div>

    <div class="bg-white border border-gray-200 rounded-b-xl overflow-hidden shadow-sm">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200 text-sm text-gray-500">
          <tr>
            <th class="py-4 px-6 font-medium">廠商名稱</th>
            <th class="py-4 px-6 font-medium">統一編號</th>
            <th class="py-4 px-6 font-medium">聯絡人</th>
            <th class="py-4 px-6 font-medium">註冊時間</th>
            <th class="py-4 px-6 font-medium">狀態</th>
            <th class="py-4 px-6 font-medium text-center">操作</th>
          </tr>
        </thead>
        <tbody id="vendorTableBody" class="text-sm divide-y divide-gray-100">
          <tr>
            <td colspan="6" class="py-8 text-center text-gray-500">資料載入中...</td>
          </tr>
        </tbody>
      </table>
      
      <div class="py-4 text-center border-t border-gray-100">
        <button class="text-sm text-gray-500 hover:text-black">Load more 100+</button>
      </div>
    </div>
  </main>

  <script>
    // 儲存從資料庫抓回來的完整資料
    let allVendorsData = [];

    // 記錄目前的篩選狀態（預設：不搜字、看全部）
    let currentSearchTerm = '';
    let currentStatusFilter = 'all';

    // 1. 去後端抓資料的 Function
    async function fetchVendorList() {
      try {
        // 模擬資料庫回傳
        setTimeout(() => {
          allVendorsData = [
            { id: 'V001', name: '美味餐飲企業', taxId: '12345678', contact: '王大明', date: '2026/01/15', status: 'pending' },
            { id: 'V002', name: '極速科技公司', taxId: '87654321', contact: '李小華', date: '2026/02/10', status: 'active' },
            { id: 'V003', name: '潮流服飾網', taxId: '11223344', contact: '陳阿美', date: '2025/11/20', status: 'suspended' },
            { id: 'V004', name: '綠能生活圈', taxId: '99887766', contact: '林建國', date: '2026/02/25', status: 'pending' },
            { id: 'V005', name: '星空咖啡廳', taxId: '55667788', contact: '張大明', date: '2026/02/28', status: 'active' }
          ];
          // 資料抓回來後，執行一次綜合篩選來畫出表格
          applyFilters();
        }, 800);
      } catch (error) {
        document.getElementById('vendorTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-4 text-red-500">載入失敗</td></tr>';
      }
    }

    // 2. 綜合篩選邏輯 (核心！)
    function applyFilters() {
      let filteredData = allVendorsData;

      // 第一關：用狀態篩選
      if (currentStatusFilter !== 'all') {
        filteredData = filteredData.filter(vendor => vendor.status === currentStatusFilter);
      }

      // 第二關：用輸入的關鍵字篩選 (廠商名稱、統編、或聯絡人)
      if (currentSearchTerm.trim() !== '') {
        const keyword = currentSearchTerm.toLowerCase();
        
        filteredData = filteredData.filter(vendor => 
          vendor.name.toLowerCase().includes(keyword) ||
          vendor.taxId.includes(keyword) ||
          vendor.contact.toLowerCase().includes(keyword)
        );
      }

      // 把過濾完的資料交給畫表格的函數
      renderTable(filteredData);
    }

    // 3. 負責把資料畫成 HTML 表格的 Function
    function renderTable(dataArray) {
      const tbody = document.getElementById('vendorTableBody');
      tbody.innerHTML = ''; // 清空原本的內容

      // 如果篩選後沒有資料
      if (dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-500">找不到符合的資料</td></tr>';
        return;
      }

      // 逐筆把資料畫出來
      dataArray.forEach(vendor => {
        let statusConfig = { text: '', colorClass: '', buttonHtml: '' };
        
        // 根據狀態決定顏色與按鈕
        if (vendor.status === 'pending') {
          statusConfig.text = '待審核';
          statusConfig.colorClass = 'text-orange-500';
          // 這裡加上了 onclick 事件，未來可以跳轉到審核頁面
          statusConfig.buttonHtml = `<button onclick="window.location.href='vendor-review.html'" class="bg-black text-white px-4 py-1.5 rounded-md hover:bg-gray-800 transition-colors text-sm">審核</button>`;
        } else if (vendor.status === 'active') {
          statusConfig.text = '已啟用';
          statusConfig.colorClass = 'text-green-500';
          // 🌟 跳轉到 vendor-detail.html
          statusConfig.buttonHtml = `<button onclick="window.location.href='vendor-detail.html?id=${vendor.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        } else if (vendor.status === 'suspended') {
          statusConfig.text = '已停權';
          statusConfig.colorClass = 'text-red-500';
          // 🌟 跳轉到 vendor-detail.html
          statusConfig.buttonHtml = `<button onclick="window.location.href='vendor-detail.html?id=${vendor.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        }

        const rowHtml = `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="py-4 px-6">${vendor.name}</td>
            <td class="py-4 px-6">${vendor.taxId}</td>
            <td class="py-4 px-6">${vendor.contact}</td>
            <td class="py-4 px-6">${vendor.date}</td>
            <td class="py-4 px-6 font-semibold ${statusConfig.colorClass}">${statusConfig.text}</td>
            <td class="py-4 px-6 text-center">${statusConfig.buttonHtml}</td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    // 4. 監聽器：當下拉選單改變時
    document.getElementById('statusFilter').addEventListener('change', function(event) {
      currentStatusFilter = event.target.value;
      applyFilters(); 
    });

    // 5. 監聽器：當搜尋框輸入文字時 (即時觸發)
    document.getElementById('searchInput').addEventListener('input', function(event) {
      currentSearchTerm = event.target.value;
      applyFilters(); 
    });

    // 網頁一開好，立刻啟動抓資料的流程
    document.addEventListener('DOMContentLoaded', fetchVendorList);
  </script>

</body>
</html>
