<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廠商資料審核 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    
    <button onclick="window.location.href='vendor.html'" class="text-gray-500 hover:text-black flex items-center text-sm font-medium mb-4">
      <span class="mr-2">←</span> 返回廠商列表
    </button>

    <h1 class="text-3xl font-bold">廠商資料審核</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8 relative">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
          <p class="text-gray-500 font-medium">資料讀取中...</p>
        </div>

        <h2 class="text-xl font-bold border-b pb-4">廠商資料</h2>

        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500 w-24 inline-block">基本資料</span></p>
          <p><span class="text-gray-500 w-24 inline-block">公司名稱：</span> <span id="companyName" class="font-medium">-</span></p>
          <p><span class="text-gray-500 w-24 inline-block">代表人：</span> <span id="representative">-</span></p>
          <p><span class="text-gray-500 w-24 inline-block">地址：</span> <span id="address">-</span></p>
          <p><span class="text-gray-500 w-24 inline-block">電話：</span> <span id="phone">-</span></p>
          <p><span class="text-gray-500 w-24 inline-block">稅籍ID：</span> <span id="taxId">-</span></p>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500 w-24 inline-block">聯絡人資訊</span></p>
          <p><span class="text-gray-500 w-24 inline-block">聯絡人：</span> <span id="contactName">-</span></p>
          <div class="flex space-x-12">
            <p><span class="text-gray-500 w-12 inline-block">手機：</span> <span id="contactMobile">-</span></p>
            <p><span class="text-gray-500 w-12 inline-block">Email：</span> <span id="contactEmail">-</span></p>
          </div>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500">附件</span></p>
          <div class="flex space-x-4 mt-2">
            <div class="w-40 h-32 bg-gray-100 border border-dashed border-gray-300 rounded-lg flex items-center justify-center text-gray-500 cursor-pointer hover:bg-gray-200 transition">
              公司登記統編截圖
            </div>
            <div class="w-40 h-32 bg-gray-100 border border-dashed border-gray-300 rounded-lg flex items-center justify-center text-gray-500 cursor-pointer hover:bg-gray-200 transition">
              負責人身分證正反面
            </div>
          </div>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500 w-24 inline-block">公司簡介</span></p>
          <p><span class="text-gray-500 w-24 inline-block">行業：</span> <span id="industry">-</span></p>
          <p><span class="text-gray-500 w-24 inline-block">品牌連結：</span> <a href="#" id="brandLink" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline">-</a></p>
        </div>

      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 h-fit space-y-8">
        <h2 class="text-xl font-bold border-b pb-4">審核操作</h2>
        
        <div class="space-y-2 text-sm">
          <p><span class="text-gray-500">狀態：</span> <span id="statusBadge" class="font-semibold text-orange-500">待審核</span></p>
          <p><span class="text-gray-500">提交時間：</span> <span id="submitTime">-</span></p>
        </div>

        <div class="space-y-3 pt-4 border-t border-gray-100">
          <button onclick="handleReview('approve')" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-3 rounded-lg transition-colors">
            通過審核
          </button>
          <button onclick="handleReview('reject')" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-lg transition-colors">
            駁回申請
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function fetchVendorDetail() {
      try {
        // 1. 抓取網址上的 ID 參數 (例如 vendor-review.html?id=V001)
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('id');
        
        console.log(`正在讀取廠商 ID: ${vendorId} 的資料...`);

        setTimeout(() => {
          // 2. 建立廠商的模擬資料庫 (放兩筆待審核的資料測試)
          const mockDatabase = {
            'V001': {
              companyName: '美味餐飲企業股份有限公司',
              representative: '王大明',
              address: '台北市信義區信義路五段7號',
              phone: '02-1234-5678',
              taxId: '12345678',
              contactName: '王小明',
              contactMobile: '0912-345-678',
              contactEmail: 'xiaoming@yummy.com.tw',
              industry: '餐飲服務業',
              brandLink: 'https://www.yummy-food.com.tw',
              submitTime: '2026/01/15 14:30:00',
              status: 'pending'
            },
            'V004': {
              companyName: '綠能生活圈有限公司',
              representative: '林建國',
              address: '台中市西屯區台灣大道三段',
              phone: '04-9876-5432',
              taxId: '99887766',
              contactName: '林小華',
              contactMobile: '0988-777-666',
              contactEmail: 'contact@greenlife.com.tw',
              industry: '環保用品零售',
              brandLink: 'https://www.greenlife.com.tw',
              submitTime: '2026/02/25 10:15:00',
              status: 'pending'
            }
          };

          // 3. 根據 ID 拿出對應的廠商資料
          const vendorData = mockDatabase[vendorId];

          if (!vendorData) {
            alert("找不到這筆廠商資料，請返回列表重新選擇！");
            window.location.href = 'vendor.html';
            return;
          }

          // 4. 把資料填入 HTML
          document.getElementById('companyName').innerText = vendorData.companyName;
          document.getElementById('representative').innerText = vendorData.representative;
          document.getElementById('address').innerText = vendorData.address;
          document.getElementById('phone').innerText = vendorData.phone;
          document.getElementById('taxId').innerText = vendorData.taxId;
          document.getElementById('contactName').innerText = vendorData.contactName;
          document.getElementById('contactMobile').innerText = vendorData.contactMobile;
          document.getElementById('contactEmail').innerText = vendorData.contactEmail;
          document.getElementById('industry').innerText = vendorData.industry;
          document.getElementById('submitTime').innerText = vendorData.submitTime;
          
          // 處理可點擊的品牌連結
          const brandLinkElem = document.getElementById('brandLink');
          brandLinkElem.innerText = vendorData.brandLink;
          brandLinkElem.href = vendorData.brandLink;

          // 隱藏載入中遮罩
          document.getElementById('loadingOverlay').style.display = 'none';

        }, 600);

      } catch (error) {
        console.error("載入失敗：", error);
        alert("資料載入失敗，請重試！");
      }
    }

    // 處理審核按鈕
    function handleReview(action) {
      const actionText = action === 'approve' ? '通過' : '駁回';
      const isConfirmed = confirm(`您確定要「${actionText}」這筆廠商的申請嗎？`);
      
      if (isConfirmed) {
        alert(`已成功${actionText}！將返回廠商列表頁。`);
        window.location.href = 'vendor.html';
      }
    }

    // 網頁載入時立刻去抓資料
    document.addEventListener('DOMContentLoaded', fetchVendorDetail);
  </script>

</body>
</html>
