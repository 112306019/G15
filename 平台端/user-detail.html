<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般用戶詳細資料 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <button onclick="window.location.href='user.html'" class="text-gray-500 hover:text-black flex items-center text-sm font-medium mb-4">
      <span class="mr-2">←</span> 返回一般用戶列表
    </button>

    <h1 class="text-3xl font-bold">一般用戶詳細資料</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8 relative">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
          <p class="text-gray-500 font-medium">資料讀取中...</p>
        </div>

        <h2 class="text-xl font-bold border-b pb-4">用戶資訊</h2>
        
        <div class="space-y-4 text-sm">
          <p><span class="text-gray-500 inline-block w-24">姓名：</span> <span id="userName" class="font-medium">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">電話號碼：</span> <span id="userPhone">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">Email：</span> <span id="userEmail">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">註冊日期：</span> <span id="userDate">-</span></p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 h-fit space-y-6">
        <h2 class="text-xl font-bold border-b pb-4">帳號狀態</h2>
        
        <div class="space-y-4 text-sm">
          <p><span class="text-gray-500 inline-block w-20">目前狀態：</span> <span id="statusBadge" class="font-semibold px-3 py-1 rounded-full bg-gray-100">-</span></p>
        </div>

        <div id="kocApplyNotice" class="hidden mt-6 pt-6 border-t border-gray-100">
          <div class="bg-orange-50 border border-orange-200 p-4 rounded-lg">
            <p class="text-orange-700 text-sm font-medium mb-2">⚠️ 身份升級申請</p>
            <p class="text-orange-600 text-xs mb-3">此用戶目前正在申請成為 KOC，請前往審核中心處理。</p>
            <button onclick="window.location.href='koc-review.html?id=K001'" class="w-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium py-2 rounded-md transition-colors">
              前往 KOC 審核
            </button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    async function fetchUserDetail() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        setTimeout(() => {
          // 模擬資料庫
          const mockDatabase = {
            'U001': { name: '陳曉明', phone: '0912-345-678', date: '2026/01/05', email: 'xiaoming@gmail.com', status: 'applying' },
            'U002': { name: '林心如', phone: '0922-333-444', date: '2026/01/12', email: 'ruby_lin@yahoo.com.tw', status: 'active' },
            'U003': { name: '張建國', phone: '0933-111-222', date: '2025/11/20', email: 'jk_zhang@hotmail.com', status: 'suspended' },
            'U004': { name: '李阿惠', phone: '0988-777-666', date: '2026/02/18', email: 'ahui_lee@gmail.com', status: 'active' },
            'U005': { name: '王大寶', phone: '0955-444-555', date: '2026/02/26', email: 'dabao_w@gmail.com', status: 'applying' }
          };

          const userData = mockDatabase[userId];

          if (!userData) {
            alert("找不到這筆資料！");
            window.location.href = 'user.html';
            return;
          }

          document.getElementById('userName').innerText = userData.name;
          document.getElementById('userPhone').innerText = userData.phone;
          document.getElementById('userEmail').innerText = userData.email;
          document.getElementById('userDate').innerText = userData.date;

          // 根據狀態改變右側 Badge 的顏色與文字
          const badge = document.getElementById('statusBadge');
          const applyNotice = document.getElementById('kocApplyNotice');

          if (userData.status === 'active') {
            badge.innerText = '已啟用';
            badge.classList.add('text-green-600', 'bg-green-50');
          } else if (userData.status === 'suspended') {
            badge.innerText = '已停權';
            badge.classList.add('text-red-600', 'bg-red-50');
          } else if (userData.status === 'applying') {
            badge.innerText = 'KOC申請中';
            badge.classList.add('text-orange-600', 'bg-orange-50');
            // 如果正在申請中，就把提示區塊顯示出來
            applyNotice.classList.remove('hidden');
          }

          document.getElementById('loadingOverlay').style.display = 'none';
        }, 500);
      } catch (error) {
        console.error("載入失敗");
      }
    }

    document.addEventListener('DOMContentLoaded', fetchUserDetail);
  </script>

</body>
</html>
