<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOC 資料審核 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    
    <button onclick="window.location.href='koc.html'" class="text-gray-500 hover:text-black flex items-center text-sm font-medium mb-4">
      <span class="mr-2">←</span> 返回 KOC 列表
    </button>

    <h1 class="text-3xl font-bold">KOC 資料審核</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8 relative">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
          <p class="text-gray-500 font-medium">資料讀取中...</p>
        </div>

        <h2 class="text-xl font-bold border-b pb-4">申請人資料</h2>

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">基本資料</p>
          <div class="flex items-center space-x-16">
            <p><span class="text-gray-500 mr-2">顯示名稱：</span> <span id="displayName" class="font-medium">-</span></p>
            <p><span class="text-gray-500 mr-2">全名：</span> <span id="fullName">-</span></p>
          </div>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">社群連結</p>
          
          <div class="flex items-center space-x-4">
            <div class="flex-1 flex items-center bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 hover:bg-gray-100 transition-colors overflow-hidden">
              <span class="text-gray-400 mr-2">🌐</span>
              <a href="#" id="socialUrl" target="_blank" class="bg-transparent w-full outline-none text-blue-600 hover:text-blue-800 hover:underline truncate block">
                載入中...
              </a>
            </div>
            
            <div class="w-64 flex items-center bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 hover:bg-gray-100 transition-colors overflow-hidden">
              <span class="text-gray-400 mr-2">@</span>
              <a href="#" id="socialAccount" target="_blank" class="bg-transparent w-full outline-none text-blue-600 hover:text-blue-800 hover:underline truncate block">
                載入中...
              </a>
            </div>
            
            <div class="w-16 text-center text-xs font-semibold text-gray-400">
              驗證
            </div>
          </div>
        </div>

      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 h-fit space-y-8">
        <h2 class="text-xl font-bold border-b pb-4">審核操作</h2>
        
        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500">狀態：</span> <span id="statusBadge" class="font-semibold text-orange-500">待審核</span></p>
          <p><span class="text-gray-500">提交時間：</span> <span id="submitTime">-</span></p>
        </div>

        <div class="space-y-3 pt-4 border-t border-gray-100">
          <button onclick="handleReview('approve')" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-3 rounded-lg transition-colors">
            通過審核
          </button>
          <button onclick="handleReview('reject')" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-lg transition-colors">
            駁回申請
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function fetchKocDetail() {
      try {
        // 1. 抓取網址上的 ID 參數 (例如 ?id=K005)
        const urlParams = new URLSearchParams(window.location.search);
        const kocId = urlParams.get('id');
        
        console.log(`正在向資料庫請求 KOC ID: ${kocId} 的資料...`);

        setTimeout(() => {
          // 🌟 2. 建立一個模擬的後端資料庫 (用 ID 當作尋找的鑰匙)
          const mockDatabase = {
            'K001': {
              displayName: '王美美',
              fullName: '王小美',
              socialUrl: 'https://www.instagram.com/meimei_beauty',
              socialAccount: 'meimei_beauty',
              submitTime: '2026/02/28 09:15:00',
              status: 'pending'
            },
            'K005': {
              displayName: '時尚達人Lisa',
              fullName: '林麗莎',
              socialUrl: 'https://www.instagram.com/lisa_style',
              socialAccount: 'lisa_style',
              submitTime: '2026/02/28 14:30:00',
              status: 'pending'
            }
          };

          // 🌟 3. 根據網址上的 ID，從資料庫裡面把對應的資料拿出來
          const kocData = mockDatabase[kocId];

          // 萬一網址上的 ID 在資料庫找不到（防呆機制）
          if (!kocData) {
            alert("找不到這筆資料，請返回列表重新選擇！");
            window.location.href = 'koc.html';
            return;
          }

          // 4. 把專屬於這個人的資料填入 HTML
          document.getElementById('displayName').innerText = kocData.displayName;
          document.getElementById('fullName').innerText = kocData.fullName;
          document.getElementById('submitTime').innerText = kocData.submitTime;

          const urlElem = document.getElementById('socialUrl');
          urlElem.innerText = kocData.socialUrl;
          urlElem.href = kocData.socialUrl;

          const accountElem = document.getElementById('socialAccount');
          accountElem.innerText = kocData.socialAccount;
          accountElem.href = kocData.socialUrl;

          document.getElementById('loadingOverlay').style.display = 'none';

        }, 600);

      } catch (error) {
        console.error("載入失敗：", error);
        alert("資料載入失敗，請重試！");
      }
    }

    function handleReview(action) {
      const actionText = action === 'approve' ? '通過' : '駁回';
      const isConfirmed = confirm(`您確定要「${actionText}」這名 KOC 的申請嗎？`);
      
      if (isConfirmed) {
        alert(`已成功${actionText}！將返回 KOC 列表頁。`);
        window.location.href = 'koc.html';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchKocDetail);
  </script>

</body>
</html>
