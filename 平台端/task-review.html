<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任務審核 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <button onclick="window.location.href='task.html'" class="text-gray-500 hover:text-black flex items-center text-sm font-medium mb-4">
      <span class="mr-2">←</span> 返回任務列表
    </button>

    <h1 class="text-3xl font-bold">任務審核</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8 relative">
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center rounded-xl">
          <p class="text-gray-500 font-medium">資料讀取中...</p>
        </div>

        <h2 class="text-xl font-bold border-b pb-4">任務資訊</h2>
        
        <div class="space-y-4 text-sm">
          <p><span class="text-gray-500 inline-block w-24">任務名稱：</span> <span id="taskName" class="font-medium text-lg">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">發布廠商：</span> <span id="vendorName">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">指定平台：</span> <span id="platform">-</span></p>
          <p><span class="text-gray-500 inline-block w-24">KOC標籤：</span> <span id="tags">-</span></p>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">預算與人數</p>
          <div class="flex space-x-16">
            <p><span class="text-gray-500 inline-block w-20">預算金額：</span> <span id="budget" class="text-blue-600 font-bold">-</span></p>
            <p><span class="text-gray-500 inline-block w-20">徵求人數：</span> <span id="kocCount">-</span></p>
          </div>
        </div>

        <hr class="border-gray-100">

        <div class="space-y-4 text-sm">
          <p class="font-semibold text-gray-700">任務說明</p>
          <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 text-gray-600 whitespace-pre-wrap leading-relaxed" id="description">
            -
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 h-fit space-y-8">
        <h2 class="text-xl font-bold border-b pb-4">審核操作</h2>
        
        <div class="space-y-3 text-sm">
          <p><span class="text-gray-500">狀態：</span> <span id="statusBadge" class="font-semibold text-orange-500">待審核</span></p>
          <p><span class="text-gray-500">提交時間：</span> <span id="submitTime">-</span></p>
        </div>

        <div class="space-y-3 pt-4 border-t border-gray-100">
          <button onclick="handleReview('approve')" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-3 rounded-lg transition-colors">
            通過審核 (上架任務)
          </button>
          <button onclick="handleReview('reject')" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-lg transition-colors">
            駁回申請
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function fetchTaskDetail() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        setTimeout(() => {
          // 模擬資料庫 (待審核的任務)
          const mockDatabase = {
            'T001': { 
              name: '春季彩妝新品體驗大募集', vendor: '極速科技公司', platform: 'Instagram, YouTube', 
              tags: '美容、美妝', budget: '$15,000', count: '10人', submitTime: '2026/02/25 10:00', 
              description: '邀請喜愛美妝的KOC來體驗我們最新推出的春季粉底液。\n需拍攝至少3張清晰實穿照，並發布一篇包含指定Hashtag的貼文。' 
            },
            'T004': { 
              name: '夏季防曬乳百人試用活動', vendor: '極速科技公司', platform: 'Instagram', 
              tags: '美容、旅遊', budget: '$50,000', count: '100人', submitTime: '2026/02/28 14:30', 
              description: '誠徵100位喜愛戶外活動的KOC試用夏季新款防水防曬乳。\n無須長篇大論，只需在IG限時動態分享真實使用心得並Tag官方帳號。' 
            }
          };

          const taskData = mockDatabase[taskId];

          if (!taskData) {
            alert("找不到這筆任務資料！");
            window.location.href = 'task.html';
            return;
          }

          document.getElementById('taskName').innerText = taskData.name;
          document.getElementById('vendorName').innerText = taskData.vendor;
          document.getElementById('platform').innerText = taskData.platform;
          document.getElementById('tags').innerText = taskData.tags;
          document.getElementById('budget').innerText = taskData.budget;
          document.getElementById('kocCount').innerText = taskData.count;
          document.getElementById('description').innerText = taskData.description;
          document.getElementById('submitTime').innerText = taskData.submitTime;

          document.getElementById('loadingOverlay').style.display = 'none';
        }, 500);
      } catch (error) {
        console.error("載入失敗");
      }
    }

    function handleReview(action) {
      const actionText = action === 'approve' ? '通過上架' : '駁回';
      const isConfirmed = confirm(`您確定要「${actionText}」這筆任務嗎？`);
      if (isConfirmed) {
        alert(`已成功${actionText}！將返回任務列表。`);
        window.location.href = 'task.html';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchTaskDetail);
  </script>
</body>
</html>
