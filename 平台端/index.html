<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOC 平台後台 - 總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-8">
    <h1 class="text-3xl font-bold">平台總覽</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-[#1A1A1A] text-white p-6 rounded-xl shadow-sm">
        <h3 class="text-gray-300 text-sm mb-2">總用戶數</h3>
        <p id="totalUsers" class="text-3xl font-semibold mb-2">載入中...</p>
        <p class="text-xs text-gray-400">一般用戶：<span id="generalUsers">-</span> / KOC：<span id="kocUsers">-</span></p>
      </div>
      <div class="bg-[#1A1A1A] text-white p-6 rounded-xl shadow-sm">
        <h3 class="text-gray-300 text-sm mb-2">任務狀況</h3>
        <p id="activeTasks" class="text-3xl font-semibold mb-2">載入中...</p>
        <p class="text-xs text-gray-400">進行中：<span id="activeTasksSub">-</span> / 已結案：<span id="completedTasks">-</span></p>
      </div>
      <div class="bg-[#1A1A1A] text-white p-6 rounded-xl shadow-sm">
        <h3 class="text-gray-300 text-sm mb-2">平台金流</h3>
        <p id="totalCash" class="text-3xl font-semibold mb-2">載入中...</p>
        <p class="text-xs text-gray-400">入帳：<span id="cashIn">-</span> / 出帳：<span id="cashOut">-</span></p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-6">待辦事項</h2>
        <div id="todoContainer" class="space-y-4">
          <p class="text-gray-500 text-sm text-center py-4">資料載入中...</p>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-xl font-bold mb-6">新用戶增長趨勢</h2>
        <div class="flex-1 flex items-center justify-center bg-gray-50 rounded-lg border border-dashed border-gray-300 min-h-[200px]">
          <p class="text-gray-400">圖表之後再用 JS 套件畫</p>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function fetchDashboardData() {
      try {
        console.log("正在向資料庫請求資料...");
        
        // 模擬網路延遲 1 秒
        setTimeout(() => {
          // --- 數據統計資料 ---
          const dbData = {
            totalUsers: 1560,
            generalUsers: 1000,
            kocUsers: 560,
            activeTasks: 58,
            completedTasks: 412,
            cashIn: 85000,
            cashOut: 23000
          };

          // --- 待辦事項清單資料 (陣列) ---
          const todoList = [
            { id: 'K001', type: 'KOC身份申請', name: '王小明', action: '審核', link: 'koc-review.html?id=K001' },
            { id: 'V001', type: '廠商資料審核', name: '美味餐飲企業', action: '審核', link: 'vendor-review.html?id=V001' },
            { id: 'T004', type: '爭議案件', name: '任務#A004', action: '處理', link: '#' }
          ];

          // 填入上方統計數字
          document.getElementById('totalUsers').innerText = dbData.totalUsers.toLocaleString();
          document.getElementById('generalUsers').innerText = dbData.generalUsers.toLocaleString();
          document.getElementById('kocUsers').innerText = dbData.kocUsers.toLocaleString();
          
          document.getElementById('activeTasks').innerText = dbData.activeTasks;
          document.getElementById('activeTasksSub').innerText = dbData.activeTasks;
          document.getElementById('completedTasks').innerText = dbData.completedTasks;
          
          document.getElementById('totalCash').innerText = '$' + (dbData.cashIn - dbData.cashOut).toLocaleString();
          document.getElementById('cashIn').innerText = dbData.cashIn.toLocaleString();
          document.getElementById('cashOut').innerText = dbData.cashOut.toLocaleString();

          // 自動生成待辦事項列表
          renderTodos(todoList);

        }, 1000); 

      } catch (error) {
        console.error("抓取資料發生錯誤：", error);
        document.getElementById('todoContainer').innerHTML = '<p class="text-red-500 text-sm text-center py-4">載入失敗</p>';
      }
    }

    // 把待辦事項畫到畫面上的 Function
    function renderTodos(todos) {
      const container = document.getElementById('todoContainer');
      container.innerHTML = ''; // 先清空原本的「資料載入中...」字樣

      // 迴圈把每個待辦事項轉成 HTML 塞進去
      todos.forEach(todo => {
        const todoHtml = `
          <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
            <p class="text-sm font-semibold text-gray-800">${todo.type}：${todo.name}</p>
            <button onclick="window.location.href='${todo.link}'" class="bg-[#3B82F6] hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm transition-colors">
              ${todo.action}
            </button>
          </div>
        `;
        container.innerHTML += todoHtml;
      });
    }

    // 當網頁載入完成時執行
    document.addEventListener('DOMContentLoaded', fetchDashboardData);
  </script>

</body>
</html>
