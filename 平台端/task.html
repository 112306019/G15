<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任務管理 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">客服</a>      </nav>
    </div>
  </header>

  <main class="p-8 max-w-7xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold">任務管理</h1>

    <div class="flex items-center justify-between bg-white p-4 rounded-t-xl border border-gray-200 border-b-0">
      
      <div class="relative w-80">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
        <input id="searchInput" type="text" placeholder="搜尋任務名稱、廠商名稱" class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
      </div>
      
      <select id="statusFilter" class="border border-gray-300 px-4 py-2 rounded-lg text-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-black cursor-pointer">
        <option value="all">狀態篩選 (全部)</option>
        <option value="pending">待審核</option>
        <option value="active">進行中</option>
        <option value="completed">已結案</option>
      </select>
    </div>

    <div class="bg-white border border-gray-200 rounded-b-xl overflow-hidden shadow-sm">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b border-gray-200 text-sm text-gray-500">
          <tr>
            <th class="py-4 px-6 font-medium">任務名稱</th>
            <th class="py-4 px-6 font-medium">廠商名稱</th>
            <th class="py-4 px-6 font-medium">預算金額</th>
            <th class="py-4 px-6 font-medium">徵求人數</th>
            <th class="py-4 px-6 font-medium">發佈時間</th>
            <th class="py-4 px-6 font-medium">狀態</th>
            <th class="py-4 px-6 font-medium text-center">操作</th>
          </tr>
        </thead>
        <tbody id="taskTableBody" class="text-sm divide-y divide-gray-100">
          <tr>
            <td colspan="7" class="py-8 text-center text-gray-500">資料載入中...</td>
          </tr>
        </tbody>
      </table>
      
      <div class="py-4 text-center border-t border-gray-100">
        <button class="text-sm text-gray-500 hover:text-black">Load more 500+</button>
      </div>
    </div>
  </main>

  <script>
    let allTasksData = [];
    let currentSearchTerm = '';
    let currentStatusFilter = 'all';

    async function fetchTaskList() {
      try {
        setTimeout(() => {
          allTasksData = [
            { id: 'T001', name: '春季彩妝新品體驗大募集', vendor: '極速科技公司', budget: '$15,000', count: '10人', date: '2026/02/25', status: 'pending' },
            { id: 'T002', name: '信義區新開幕拉麵試吃特派員', vendor: '美味餐飲企業', budget: '$5,000', count: '5人', date: '2026/02/20', status: 'active' },
            { id: 'T003', name: '環保隨行杯開箱評測', vendor: '綠能生活圈', budget: '$8,000', count: '20人', date: '2026/01/15', status: 'completed' },
            { id: 'T004', name: '夏季防曬乳百人試用活動', vendor: '極速科技公司', budget: '$50,000', count: '100人', date: '2026/02/28', status: 'pending' },
            { id: 'T005', name: '隱藏版甜點店探店打卡', vendor: '美味餐飲企業', budget: '$3,000', count: '3人', date: '2026/02/10', status: 'active' }
          ];
          applyFilters();
        }, 600);
      } catch (error) {
        document.getElementById('taskTableBody').innerHTML = '<tr><td colspan="7" class="text-center py-4 text-red-500">載入失敗</td></tr>';
      }
    }

    function applyFilters() {
      let filteredData = allTasksData;

      if (currentStatusFilter !== 'all') {
        filteredData = filteredData.filter(task => task.status === currentStatusFilter);
      }

      if (currentSearchTerm.trim() !== '') {
        const keyword = currentSearchTerm.toLowerCase();
        filteredData = filteredData.filter(task => 
          task.name.toLowerCase().includes(keyword) ||
          task.vendor.toLowerCase().includes(keyword)
        );
      }

      renderTable(filteredData);
    }

    function renderTable(dataArray) {
      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = ''; 

      if (dataArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-gray-500">找不到符合的任務資料</td></tr>';
        return;
      }

      dataArray.forEach(task => {
        let statusConfig = { text: '', colorClass: '', buttonHtml: '' };
        
        // 🌟 這裡確保了待審核跳轉到 task-review，其他狀態跳轉到 task-detail
        if (task.status === 'pending') {
          statusConfig.text = '待審核';
          statusConfig.colorClass = 'text-orange-500';
          statusConfig.buttonHtml = `<button onclick="window.location.href='task-review.html?id=${task.id}'" class="bg-black text-white px-4 py-1.5 rounded-md hover:bg-gray-800 transition-colors text-sm">審核</button>`;
        } else if (task.status === 'active') {
          statusConfig.text = '進行中';
          statusConfig.colorClass = 'text-green-500';
          statusConfig.buttonHtml = `<button onclick="window.location.href='task-detail.html?id=${task.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        } else if (task.status === 'completed') {
          statusConfig.text = '已結案';
          statusConfig.colorClass = 'text-gray-500';
          statusConfig.buttonHtml = `<button onclick="window.location.href='task-detail.html?id=${task.id}'" class="border border-gray-300 text-gray-700 px-4 py-1.5 rounded-md hover:bg-gray-50 transition-colors text-sm">查看詳情</button>`;
        }

        const rowHtml = `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="py-4 px-6 font-medium">${task.name}</td>
            <td class="py-4 px-6 text-gray-500">${task.vendor}</td>
            <td class="py-4 px-6 font-medium text-blue-600">${task.budget}</td>
            <td class="py-4 px-6">${task.count}</td>
            <td class="py-4 px-6 text-gray-500">${task.date}</td>
            <td class="py-4 px-6 font-semibold ${statusConfig.colorClass}">${statusConfig.text}</td>
            <td class="py-4 px-6 text-center">${statusConfig.buttonHtml}</td>
          </tr>
        `;
        tbody.innerHTML += rowHtml;
      });
    }

    document.getElementById('statusFilter').addEventListener('change', function(event) {
      currentStatusFilter = event.target.value;
      applyFilters(); 
    });

    document.getElementById('searchInput').addEventListener('input', function(event) {
      currentSearchTerm = event.target.value;
      applyFilters(); 
    });

    document.addEventListener('DOMContentLoaded', fetchTaskList);
  </script>

</body>
</html>
