<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客服系統 - KOC 平台後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-screen overflow-hidden flex flex-col">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-8">
      <div class="text-xl font-bold tracking-wider">LOGO</div>
      <nav class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">總覽</a>
        <a href="vendor.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">廠商管理</a>
        <a href="koc.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">KOC管理</a>
        <a href="user.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">一般用戶管理</a>
        <a href="task.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">任務管理</a>
        <a href="finance.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-black hover:bg-gray-100">金流管理</a>
        <a href="cs.html" class="px-3 py-2 rounded-md text-sm font-medium bg-black text-white">客服</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 flex max-w-7xl mx-auto w-full p-6 gap-6 h-full overflow-hidden">
    
    <div class="w-1/3 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden h-full">
      <div class="p-4 border-b border-gray-100 shrink-0">
        <h2 class="text-xl font-bold mb-4">訊息中心</h2>
        <div class="relative w-full mb-3">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
          <input type="text" placeholder="搜尋對話..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
        </div>
        <div class="flex space-x-2 text-sm">
          <button class="px-3 py-1 bg-black text-white rounded-full">全部</button>
          <button class="px-3 py-1 text-gray-500 hover:bg-gray-100 rounded-full transition-colors">未讀訊息</button>
        </div>
      </div>

      <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-gray-100">
        <div class="p-8 text-center text-gray-400 text-sm">載入中...</div>
      </div>
    </div>

    <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full relative">
      
      <div id="emptyChatCover" class="absolute inset-0 bg-gray-50 flex items-center justify-center z-10 rounded-xl">
        <div class="text-center text-gray-400">
          <p class="text-4xl mb-3">💬</p>
          <p>請從左側選擇一個對話開始客服服務</p>
        </div>
      </div>

      <div class="p-4 border-b border-gray-100 shrink-0 flex justify-between items-center bg-white rounded-t-xl z-0">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-500" id="chatAvatar"></div>
          <div>
            <h3 class="font-bold text-gray-800" id="chatName">讀取中</h3>
            <p class="text-xs text-blue-500 font-medium" id="chatRole">讀取中</p>
          </div>
        </div>
        <button class="text-sm text-gray-500 border border-gray-200 px-3 py-1 rounded hover:bg-gray-50">結案</button>
      </div>

      <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50 z-0">
        </div>

      <div class="p-4 border-t border-gray-100 shrink-0 bg-white rounded-b-xl z-0">
        <form id="messageForm" class="flex items-end space-x-3">
          <button type="button" class="p-2 text-gray-400 hover:text-gray-600 transition-colors">📎</button>
          <textarea id="messageInput" rows="1" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black resize-none" placeholder="輸入回覆訊息..."></textarea>
          <button type="submit" class="bg-black hover:bg-gray-800 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors">傳送</button>
        </form>
      </div>

    </div>

  </main>

  <script>
    // 模擬客服資料庫
    const mockContacts = [
      { id: 'C001', name: '王美美', role: 'KOC', avatar: '美', unread: 2, time: '10:30' },
      { id: 'C002', name: '美味餐飲企業', role: '廠商', avatar: '餐', unread: 0, time: '昨天' },
      { id: 'C003', name: '陳曉明', role: '一般用戶', avatar: '陳', unread: 0, time: '2/25' }
    ];

    // 模擬對話紀錄庫 (對應聯絡人 ID)
    const mockMessages = {
      'C001': [
        { sender: 'user', text: '你好，我想請問關於春季彩妝任務的審核進度？', time: '10:25' },
        { sender: 'user', text: '我已經補上之前漏掉的 Instagram 連結了！', time: '10:30' }
      ],
      'C002': [
        { sender: 'user', text: '請問我們這期的撥款大約什麼時候會下來？', time: '昨天 15:00' },
        { sender: 'admin', text: '您好！本期的款項預計會在下週三（3/4）統一匯出喔！', time: '昨天 15:15' },
        { sender: 'user', text: '好的，謝謝！', time: '昨天 15:20' }
      ],
      'C003': [
        { sender: 'user', text: '哈囉，我剛送出 KOC 身份申請了！', time: '2/25 09:00' },
        { sender: 'admin', text: '收到您的申請！我們會在三個工作天內完成審核，請留意系統通知。', time: '2/25 09:30' }
      ]
    };

    let currentChatId = null;

    // 1. 渲染左側聯絡人列表
    function renderContacts() {
      const contactList = document.getElementById('contactList');
      contactList.innerHTML = '';

      mockContacts.forEach(contact => {
        // 取得最後一則訊息當作預覽
        const msgs = mockMessages[contact.id];
        const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1].text : '';

        // 未讀紅點標籤
        const unreadBadge = contact.unread > 0 
          ? `<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${contact.unread}</span>` 
          : '';

        const isActive = currentChatId === contact.id ? 'bg-gray-100' : 'hover:bg-gray-50';

        const html = `
          <div onclick="selectChat('${contact.id}')" class="p-4 cursor-pointer transition-colors ${isActive}">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-[#1A1A1A] text-white rounded-full flex items-center justify-center font-bold shrink-0">
                ${contact.avatar}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-baseline mb-1">
                  <h4 class="text-sm font-bold text-gray-800 truncate">${contact.name}</h4>
                  <span class="text-xs text-gray-400 shrink-0 ml-2">${contact.time}</span>
                </div>
                <div class="flex justify-between items-center">
                  <p class="text-xs text-gray-500 truncate pr-2">${lastMsg}</p>
                  ${unreadBadge}
                </div>
              </div>
            </div>
          </div>
        `;
        contactList.innerHTML += html;
      });
    }

    // 2. 選擇對話並渲染右側
    function selectChat(contactId) {
      currentChatId = contactId;
      
      // 隱藏「請選擇對話」的遮罩
      document.getElementById('emptyChatCover').style.display = 'none';

      // 找出這個聯絡人的資料
      const contact = mockContacts.find(c => c.id === contactId);
      
      // 點開就當作已讀，把未讀數清零
      contact.unread = 0;
      renderContacts(); // 重新畫一次左邊更新顏色跟紅點

      // 更新右側頂部標題
      document.getElementById('chatAvatar').innerText = contact.avatar;
      document.getElementById('chatName').innerText = contact.name;
      document.getElementById('chatRole').innerText = contact.role;

      // 畫出對話泡泡
      renderMessages(contactId);
    }

    // 3. 渲染對話泡泡
    function renderMessages(contactId) {
      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML = '';

      const msgs = mockMessages[contactId] || [];

      msgs.forEach(msg => {
        if (msg.sender === 'user') {
          // 對方傳來的訊息 (灰底靠左)
          chatBox.innerHTML += `
            <div class="flex flex-col items-start">
              <div class="bg-white border border-gray-200 text-gray-800 rounded-2xl rounded-tl-sm px-4 py-2 max-w-[70%] text-sm shadow-sm">
                ${msg.text}
              </div>
              <span class="text-[10px] text-gray-400 mt-1 ml-1">${msg.time}</span>
            </div>
          `;
        } else {
          // 我方客服回覆的訊息 (黑底靠右)
          chatBox.innerHTML += `
            <div class="flex flex-col items-end">
              <div class="bg-black text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-[70%] text-sm shadow-sm">
                ${msg.text}
              </div>
              <span class="text-[10px] text-gray-400 mt-1 mr-1">${msg.time}</span>
            </div>
          `;
        }
      });

      // 每次畫完訊息，自動捲動到最底部
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 4. 處理發送訊息
    document.getElementById('messageForm').addEventListener('submit', function(e) {
      e.preventDefault(); // 阻止表單重整網頁
      
      if (!currentChatId) return;

      const inputElem = document.getElementById('messageInput');
      const text = inputElem.value.trim();

      if (text !== '') {
        // 取得現在時間 (簡單格式化)
        const now = new Date();
        const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

        // 把新訊息塞進資料庫
        mockMessages[currentChatId].push({
          sender: 'admin',
          text: text,
          time: timeString
        });

        // 清空輸入框並重新畫畫面
        inputElem.value = '';
        renderMessages(currentChatId);
        renderContacts(); // 為了更新左側的最後一句預覽
      }
    });

    // 支援 Enter 鍵發送 (Shift+Enter 可以換行)
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('messageForm').dispatchEvent(new Event('submit'));
      }
    });

    // 網頁載入時初始化
    document.addEventListener('DOMContentLoaded', () => {
      renderContacts();
    });
  </script>

</body>
</html>
